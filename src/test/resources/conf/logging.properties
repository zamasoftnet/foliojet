handlers = jp.cssj.logging.FileHandler, \
	java.util.logging.ConsoleHandler
	
# Logging levels by categories.
jp.cssj.level = INFO

# File
jp.cssj.logging.FileHandler.level = INFO
jp.cssj.logging.FileHandler.formatter = java.util.logging.SimpleFormatter
jp.cssj.logging.FileHandler.encoding = UTF-8
# Keep X days of logs. Default to do not delete logs.
# jp.cssj.logging.FileHandler.backlogs = 365

# Console
java.util.logging.ConsoleHandler.level = OFF
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter
