import org.gradle.api.tasks.Sync
import org.gradle.api.tasks.wrapper.Wrapper

plugins {
    id 'java-library'
}

group = 'net.zamasoft'
version = '3.5.0-SNAPSHOT'

def dependencyVersions = [
    cti              : '2.2.3',
    pdfg2d           : '1.3.0-SNAPSHOT',
    zstream          : '1.0.0-SNAPSHOT',
    batik            : '1.19',
    metadataExtractor: '2.20.0',
    imageioJpeg      : '3.13.1',
    phCss            : '8.2.1',
    htmlBalancer     : '1.1.0',
    saxon            : '12.9',
    xmlApis          : '1.4.01',
    okapiBarcode     : '0.5.5',
    jeuclid          : '3.1.14',
    commonmark       : '0.29.0',
    brotli4j         : '1.23.0'
]

repositories {
    mavenCentral()
}

configurations.configureEach {
    resolutionStrategy.force "xml-apis:xml-apis:${dependencyVersions.xmlApis}"
    exclude group: 'xerces'
    exclude group: 'xalan'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.links('https://docs.oracle.com/javase/jp/8/docs/api/')
    options.addStringOption('Xdoclint:none', '-quiet')
    destinationDir = new File(System.getProperty('java.io.tmpdir'), 'foliojet-javadocs/root')
    doFirst {
        destinationDir.mkdirs()
    }
}

tasks.named('processResources').configure {
    filteringCharset = 'UTF-8'

    doLast {
        def outputDir = destinationDir
        if (outputDir == null || !outputDir.exists()) {
            return
        }

        def propertyFiles = fileTree(outputDir) {
            include '**/*.properties'
        }
        if (propertyFiles.isEmpty()) {
            return
        }

        def tempDir = new File(temporaryDir, 'native2ascii')
        project.delete(tempDir)
        ant.native2ascii(src: outputDir, dest: tempDir, encoding: 'UTF-8', includes: '**/*.properties')
        copy {
            from tempDir
            into outputDir
            include '**/*.properties'
            includeEmptyDirs = false
        }
    }
}

def copyRuntimeDependencies = tasks.register('copyRuntimeDependencies', Sync) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('dependencies')
}

tasks.named('assemble').configure {
    dependsOn copyRuntimeDependencies
}

dependencies {
    api "net.zamasoft:cti-if:${dependencyVersions.cti}"
    api "io.github.mimidesunya:pdfg2d-core:${dependencyVersions.pdfg2d}"
    api "io.github.mimidesunya:pdfg2d-font:${dependencyVersions.pdfg2d}"
    api "net.zamasoft:zstream-io:${dependencyVersions.zstream}"
    api "io.github.mimidesunya:pdfg2d-pdf:${dependencyVersions.pdfg2d}"
    api "net.zamasoft:zstream-resolver:${dependencyVersions.zstream}"
    api "io.github.mimidesunya:pdfg2d-svg:${dependencyVersions.pdfg2d}"
    api "net.zamasoft:html-balancer:${dependencyVersions.htmlBalancer}"
    api "org.apache.xmlgraphics:batik-svggen:${dependencyVersions.batik}"
    // SVGGraphics2DがHTML内のPNG/JPEGをdata URIとしてSVGへ埋め込む際に必要。
    // これがないと画像を含むSVG出力がImageWriter=nullで失敗する。
    api "org.apache.xmlgraphics:batik-codec:${dependencyVersions.batik}"
    api "org.apache.xmlgraphics:batik-script:${dependencyVersions.batik}"
    api "org.apache.xmlgraphics:batik-ext:${dependencyVersions.batik}"
    api "org.apache.xmlgraphics:batik-bridge:${dependencyVersions.batik}"
    api "org.apache.xmlgraphics:batik-gvt:${dependencyVersions.batik}"
    api "org.apache.xmlgraphics:batik-anim:${dependencyVersions.batik}"
    api "com.drewnoakes:metadata-extractor:${dependencyVersions.metadataExtractor}"
    api "com.twelvemonkeys.imageio:imageio-jpeg:${dependencyVersions.imageioJpeg}"
    api "com.helger:ph-css:${dependencyVersions.phCss}"
    api "net.sf.saxon:Saxon-HE:${dependencyVersions.saxon}"
    api "xml-apis:xml-apis:${dependencyVersions.xmlApis}"
    api "uk.org.okapibarcode:okapibarcode:${dependencyVersions.okapiBarcode}"
    api "de.rototor.jeuclid:jeuclid-core:${dependencyVersions.jeuclid}"
    api "org.commonmark:commonmark:${dependencyVersions.commonmark}"
    api "org.commonmark:commonmark-ext-gfm-tables:${dependencyVersions.commonmark}"
    implementation "com.aayushatharva.brotli4j:brotli4j:${dependencyVersions.brotli4j}"
    // Paged SVGのWOFF2はRFC 7932の実圧縮を使う。製品jarは一つなので、
    // 対応する全OS/CPUの公式Brotli native providerを同梱する。
    runtimeOnly "com.aayushatharva.brotli4j:native-linux-x86_64:${dependencyVersions.brotli4j}"
    runtimeOnly "com.aayushatharva.brotli4j:native-linux-aarch64:${dependencyVersions.brotli4j}"
    runtimeOnly "com.aayushatharva.brotli4j:native-linux-armv7:${dependencyVersions.brotli4j}"
    runtimeOnly "com.aayushatharva.brotli4j:native-linux-s390x:${dependencyVersions.brotli4j}"
    runtimeOnly "com.aayushatharva.brotli4j:native-linux-ppc64le:${dependencyVersions.brotli4j}"
    runtimeOnly "com.aayushatharva.brotli4j:native-linux-riscv64:${dependencyVersions.brotli4j}"
    runtimeOnly "com.aayushatharva.brotli4j:native-windows-x86_64:${dependencyVersions.brotli4j}"
    runtimeOnly "com.aayushatharva.brotli4j:native-windows-aarch64:${dependencyVersions.brotli4j}"
    runtimeOnly "com.aayushatharva.brotli4j:native-osx-x86_64:${dependencyVersions.brotli4j}"
    runtimeOnly "com.aayushatharva.brotli4j:native-osx-aarch64:${dependencyVersions.brotli4j}"
    testImplementation 'junit:junit:4.13.2'
    // veraPDF (greenfield parser) for automated PDF/UA conformance validation
    testImplementation 'org.verapdf:validation-model:1.26.5'
    // 出力PDFの名前付き宛先(id断片・しおり)を読むため(2026-08-03)。
    // 宛先は表示リストの描画命令ではないので、goldenのダンプには出てこない
    testImplementation 'org.apache.pdfbox:pdfbox:3.0.3'
}

// ---------------------------------------------------------------------------
// テスト用フォントの取得(2026-08-03)
//
// **テストは環境のフォントを使わない。** 以前は
// src/test/resources/conf/profiles/fonts/fonts.xml に
// <all-system-fonts /> があり、その機械にインストールされたフォントが
// 全部登録されていた。テストの期待値は文字の座標を固定するものなので、
// 機械が変われば基準がずれる——テストにならない。
//
// 代わりに公開されている Noto を取得して使う。版は URL と SHA-256 で
// 固定する(GitHub のリリース資産は不変)。取得済みなら何もしないので、
// 2回目以降とオフラインでも動く。copperpdf4/dev/build.gradle の同名
// タスクと同じ資産を使う。
// ---------------------------------------------------------------------------
def testFontDir = layout.buildDirectory.dir('fonts/noto-auto')
def testConfDir = layout.buildDirectory.dir('testconf')
def testFontArchives = [
        [name: '16_NotoSansJP.zip',
         url : 'https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/16_NotoSansJP.zip',
         sha256: '2bbdd2c20f30670b39ca735c96d75f1fdabdb348103e43b820cf17701fd22b18'],
        [name: '12_NotoSerifJP.zip',
         url : 'https://github.com/notofonts/noto-cjk/releases/download/Serif2.003/12_NotoSerifJP.zip',
         sha256: '53bdd2a6e4eb63bf24f7890e018dddb94366e3555d0814c72b74fbb128f328f0'],
        [name: '11_NotoSansMonoCJKjp.zip',
         url : 'https://github.com/notofonts/noto-cjk/releases/download/Sans2.004/11_NotoSansMonoCJKjp.zip',
         sha256: '6c8faf475ce78fa37486dd5d8920e4bb4450b1b0f3c497edf3ba2d25cf52ab78'],
]

static String sha256OfFile(File file) {
    java.security.MessageDigest digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[65536]
        int read
        while ((read = input.read(buffer)) != -1) {
            digest.update(buffer, 0, read)
        }
    }
    return digest.digest().encodeHex().toString()
}

tasks.register('fetchTestFonts') {
    group = 'verification'
    description = 'テストで使う Noto フォントを公開リリースから取得します(版はハッシュで固定)。'
    def outDir = testFontDir.get().asFile
    def dlDir = layout.buildDirectory.dir('fonts/download').get().asFile
    outputs.dir(outDir)
    outputs.upToDateWhen { new File(outDir, 'NotoSansJP-Regular.otf').isFile() }
    doLast {
        outDir.mkdirs()
        dlDir.mkdirs()
        testFontArchives.each { archive ->
            def zip = new File(dlDir, archive.name)
            if (!zip.isFile() || sha256OfFile(zip) != archive.sha256) {
                logger.lifecycle("テスト用フォントを取得します: ${archive.name}")
                zip.withOutputStream { out ->
                    new URL(archive.url).withInputStream { input -> out << input }
                }
                def actual = sha256OfFile(zip)
                if (actual != archive.sha256) {
                    zip.delete()
                    throw new GradleException(
                            "${archive.name} のハッシュが一致しません: 期待=${archive.sha256} 実際=${actual}")
                }
            }
            // .otf だけを平らに取り出す(書庫によって SubsetOTF/JP/ 配下にある)
            copy {
                from zipTree(zip)
                include '**/*.otf'
                eachFile { it.relativePath = new RelativePath(true, it.name) }
                includeEmptyDirs = false
                into outDir
            }
        }
    }
}

// テストが使う設定ディレクトリ。src/test/resources/conf をそのまま使うと
// 取得したフォントを作業ツリーへ置くことになるので、build の下へ組み立てる。
tasks.register('prepareTestConf', Copy) {
    dependsOn tasks.named('fetchTestFonts')
    from('src/test/resources/conf')
    into testConfDir
    from(testFontDir) {
        into 'profiles/fonts/truetype/noto-auto'
    }
}

tasks.named('test') {
    dependsOn tasks.named('prepareTestConf')
    useJUnit()
    // ライセンスを与えて実行する口(2026-08-02)。既定は無ライセンス
    // (limited)で、これまでの実行条件を変えない。
    //   -PlicenseKey=license-key.standard
    // を付けると copperpdf4 の dev/build/conf を設定ディレクトリとして
    // 使い、その鍵で動く。ライセンスでしか使えない入出力プロパティ
    // (viewer-preferences の一部・HTTP認証など)を検査するために要る。
    if (project.hasProperty('licenseKey')) {
        def copperConf = file('../copperpdf4/dev/build/conf')
        systemProperty 'jp.cssj.copper.config', copperConf.absolutePath
        systemProperty 'jp.cssj.copper.license-key', project.property('licenseKey')
    }
    // -PnoAssertions で本番と同じ条件(assertion無効)にする。
    // 「不変条件が破れたまま処理が続くと出力はどうなるか」を測るため
    enableAssertions = !project.hasProperty('noAssertions')
    // -PtestHeap=256m 等で上書きできる。1変換あたりの必要ヒープを
    // 二分探索で測るため(2026-07-26)
    maxHeapSize = project.hasProperty('testHeap') ? project.property('testHeap') : '1024m'
    // 2026-07-24: テスト実行の並列化(カイゼン)。従来は単一フォークで
    // 全395スイート直列・7〜9分かかっていた。各テストはDirectSessionの
    // インプロセス変換+一時ファイル(ユニーク名)で独立しており、
    // フォーク分離(別JVM)なら静的状態も共有しない。メモリは
    // フォーク数×maxHeapSize を上限に見積もること(30GB環境で8×1GB)。
    maxParallelForks = Math.min(8, Runtime.runtime.availableProcessors())
    jvmArgs '--add-exports=java.desktop/com.sun.imageio.plugins.jpeg=ALL-UNNAMED'
    workingDir = rootProject.projectDir
    // 隔離中のテスト。`-PincludeQuarantined`で除外を解除して現状を確認できる。
    // 理由と再開条件は docs/history/2026-07-25-quarantined-tests.md を参照。
    if (!project.hasProperty('includeQuarantined')) {
        // PageBreakByBrTest と PageBreakByWrapTest は隔離解除した(2026-08-03)。
        // どちらも `font: 12pt/1 monospace` のASCIIの送り幅に依存しており、
        // 総称フォント monospace が等幅でないフォントへ解決されるために
        // 落ちていた。テスト用フォントを固定し、monospace の先頭を
        // Noto Sans Mono CJK JP にしたところ、**元の期待値のまま通った**
        // ——期待値が正しく、フォント解決の側が原因だったことの裏付け。
        // FlowTest だけは別問題(CJKの段組で、期待値165はcopper3.2時代のもの)
        // なので隔離を続ける。
        exclude 'jp/cssj/test/unit/_0410_column_width/FlowTest.class'
        exclude 'jp/cssj/test/unit/_1060_META/DoubleDeclMetaTest.class'
        exclude 'jp/cssj/test/unit/_1060_META/DoubleDeclTest.class'
        exclude 'jp/cssj/test/unit/_1060_META/DoubleMetaTest.class'
        exclude 'jp/cssj/test/unit/_1060_META/HTMLEUCTest.class'
    }

    // 一時ディレクトリ。既定の `local` は /mnt/f(DrvFs)にあり、掃過では
    // LayoutSource の spill 等でここへも書くため I/O 律速の一因になる。
    // -PtestTmpDir=/dev/shm/foliojet のように速い場所を指せる(2026-07-28)
    def configuredTestTmpDir = project.hasProperty('testTmpDir') ? project.property('testTmpDir') : 'local'
    systemProperty 'java.io.tmpdir', configuredTestTmpDir
    systemProperty 'java.awt.headless', 'true'
    // ハングアップ検出(進捗なし締切)。製品既定は無制限(オーナー裁定
    // 2026-08-01——誤爆すると正当な文書が失敗するため)で、ライブロックを
    // 失敗として検出したいテストハーネス側が明示的に有効化する。
    // -Dfoliojet.noProgressSeconds を外から渡せば下の一括転送が上書きする
    systemProperty 'foliojet.noProgressSeconds', '120'
    systemProperty 'jp.cssj.copper.config', testConfDir.get().asFile.absolutePath
    systemProperty 'jp.cssj.driver.default', testConfDir.get().file('profiles/default.properties').asFile.absolutePath
    // foliojet.* は一つ残らずテストJVMへ渡す。
    // 以前は1つずつ if で列挙しており、**新しい調査用スイッチを足すたびに
    // ここも直す必要があった**——忘れると「プロパティを渡したのに何も
    // 起きない」という、原因の分かりにくい空振りになる(2026-07-26に踏んだ)。
    // 個別に列挙して守るものは何もないので一括で渡す。
    // net.zamasoft.foliojet.debug.* も同じ理由で一括で渡す(2026-07-28)。
    // 再開トレース(resume-trace.dir)は渡されていなかったため、指定しても
    // 何も出ず、上のコメントが書いているのと同じ空振りを起こしていた。
    System.getProperties().stringPropertyNames().findAll {
        it.startsWith('foliojet.') || it.startsWith('net.zamasoft.foliojet.debug.')
    }.each { k ->
        systemProperty k, System.getProperty(k)
    }

    // 調査用スイッチ(-Dfoliojet.fuzzShrink 等)を付けたときだけ、テストの
    // 標準出力をそのまま見せる。既定では隠したまま——通常のフルテストで
    // 数万行を流すと gradle のメッセージ経路が詰まる(LESSONS.md §3.16)。
    // これが無いと `[shrink]` の出力は build/test-results の XML を
    // 掘らないと読めず、**縮小器の自己検査の結果を見落とす**。
    if (System.getProperties().stringPropertyNames().any {
        it in ['foliojet.fuzzShrink', 'foliojet.fuzzShrinkFile', 'foliojet.fuzzCheckFile', 'foliojet.fuzzOnlySeed', 'foliojet.fuzzReport', 'foliojet.scratchDoc']
    }) {
        testLogging.showStandardStreams = true
    }

    doFirst {
        // java.io.tmpdir はJVM自身では作られない。掃過向けに
        // -PtestTmpDir=/dev/shm/... を新規パスへ向けても、最初の一時
        // ファイル生成で遅れて失敗しないようテスト開始前に用意する。
        new File(configuredTestTmpDir).mkdirs()
        new File(rootProject.projectDir, 'local/unittest/pdf').mkdirs()
    }
}

tasks.named('wrapper', Wrapper).configure {
    gradleVersion = '8.9'
    distributionType = Wrapper.DistributionType.BIN
}
