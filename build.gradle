import org.gradle.api.tasks.Sync
import org.gradle.api.tasks.bundling.Jar
import org.gradle.api.tasks.wrapper.Wrapper


def moduleVersions = [
    foliojet         : '4.0.0-SNAPSHOT',
    'zs-plugin'      : '2.2.3',
    homare           : '4.0.0-SNAPSHOT',
    'zs-balancer'    : '1.1.0',
    'zs-epub'        : '0.1.0',
    'zs-sac'         : '1.3.0'
]

def javaProjectPaths = [
    ':zs-plugin',
    ':homare',
    ':zs-balancer',
    ':zs-epub',
    ':zs-sac'
] as Set

def runtimeDependencyCopyProjectPaths = [
    ':homare',
] as Set

def native2AsciiProjectPaths = [
    ':homare'
] as Set

allprojects {
    group = 'net.zamasoft'
    version = moduleVersions[project.name] ?: moduleVersions.foliojet

    repositories {
        mavenCentral()
    }
}

allprojects {
    configurations.configureEach {
        resolutionStrategy.force 'xml-apis:xml-apis:1.4.01'
    }
}

configure([rootProject]) {
    apply plugin: 'base'
}

configure(subprojects.findAll { javaProjectPaths.contains(it.path) }) {
    apply plugin: 'java-library'

    java {
        if (project.path == ':zs-plugin') {
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
        } else {
            sourceCompatibility = JavaVersion.VERSION_21
            targetCompatibility = JavaVersion.VERSION_21
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
        options.charSet = 'UTF-8'
        options.docEncoding = 'UTF-8'
        options.links('https://docs.oracle.com/javase/jp/8/docs/api/')
        options.addStringOption('Xdoclint:none', '-quiet')
        destinationDir = new File(System.getProperty('java.io.tmpdir'), 'foliojet-javadocs/' + project.path.replace(':', '_'))
        doFirst {
            destinationDir.mkdirs()
        }
    }

    tasks.named('processResources').configure {
        filteringCharset = 'UTF-8'
    }

    if (runtimeDependencyCopyProjectPaths.contains(path)) {
        def copyRuntimeDependencies = tasks.register('copyRuntimeDependencies', Sync) {
            from configurations.runtimeClasspath
            into layout.buildDirectory.dir('dependencies')
        }

        tasks.named('assemble').configure {
            dependsOn copyRuntimeDependencies
        }
    }

    if (native2AsciiProjectPaths.contains(path)) {
        tasks.named('processResources').configure {
            doLast {
                def outputDir = destinationDir
                if (outputDir == null || !outputDir.exists()) {
                    return
                }

                def propertyFiles = fileTree(outputDir) {
                    include '**/*.properties'
                }
                if (propertyFiles.isEmpty()) {
                    return
                }

                def tempDir = new File(temporaryDir, 'native2ascii')
                project.delete(tempDir)
                ant.native2ascii(src: outputDir, dest: tempDir, encoding: 'UTF-8', includes: '**/*.properties')
                copy {
                    from tempDir
                    into outputDir
                    include '**/*.properties'
                    includeEmptyDirs = false
                }
            }
        }
    }
}

project(':zs-plugin') {
    dependencies {
    }
}

