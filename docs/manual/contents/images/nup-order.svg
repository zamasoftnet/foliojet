<?xml version="1.0" encoding="UTF-8"?>
<!--
  output.n-up.order の4種類。1枚に6ページ(3列x2行)並べたときの
  ページ番号の入り方を示します。矢印は進む向きです。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="620" height="340">
	<style>
		.sheet { fill: #ffffff; stroke: #333333; stroke-width: 1.5; }
		.cell  { fill: #eef2f6; stroke: #8fa3b8; stroke-width: 1; }
		.num   { font-family: sans-serif; font-size: 20px; fill: #1f3a5f;
		         text-anchor: middle; dominant-baseline: central; }
		.cap   { font-family: monospace; font-size: 13px; fill: #333333; }
		.arrow { stroke: #d98c1f; stroke-width: 2; fill: none; marker-end: url(#a); }
	</style>
	<defs>
		<marker id="a" viewBox="0 0 10 10" refX="9" refY="5"
			markerWidth="6" markerHeight="6" orient="auto">
			<path d="M0,0 L10,5 L0,10 z" fill="#d98c1f" />
		</marker>
	</defs>

	<!-- horizontal: 左から右、上の行から -->
	<g transform="translate(20,20)">
		<text class="cap" x="0" y="0">horizontal(既定)</text>
		<rect class="sheet" x="0" y="10" width="250" height="110" />
		<rect class="cell" x="8"  y="18" width="76" height="44" />
		<rect class="cell" x="88" y="18" width="76" height="44" />
		<rect class="cell" x="168" y="18" width="74" height="44" />
		<rect class="cell" x="8"  y="68" width="76" height="44" />
		<rect class="cell" x="88" y="68" width="76" height="44" />
		<rect class="cell" x="168" y="68" width="74" height="44" />
		<text class="num" x="46"  y="40">1</text>
		<text class="num" x="126" y="40">2</text>
		<text class="num" x="205" y="40">3</text>
		<text class="num" x="46"  y="90">4</text>
		<text class="num" x="126" y="90">5</text>
		<text class="num" x="205" y="90">6</text>
		<path class="arrow" d="M60,40 L112,40" />
		<path class="arrow" d="M60,90 L112,90" />
	</g>

	<!-- horizontal-reverse: 右から左 -->
	<g transform="translate(330,20)">
		<text class="cap" x="0" y="0">horizontal-reverse</text>
		<rect class="sheet" x="0" y="10" width="250" height="110" />
		<rect class="cell" x="8"  y="18" width="76" height="44" />
		<rect class="cell" x="88" y="18" width="76" height="44" />
		<rect class="cell" x="168" y="18" width="74" height="44" />
		<rect class="cell" x="8"  y="68" width="76" height="44" />
		<rect class="cell" x="88" y="68" width="76" height="44" />
		<rect class="cell" x="168" y="68" width="74" height="44" />
		<text class="num" x="46"  y="40">3</text>
		<text class="num" x="126" y="40">2</text>
		<text class="num" x="205" y="40">1</text>
		<text class="num" x="46"  y="90">6</text>
		<text class="num" x="126" y="90">5</text>
		<text class="num" x="205" y="90">4</text>
		<path class="arrow" d="M190,40 L138,40" />
		<path class="arrow" d="M190,90 L138,90" />
	</g>

	<!-- vertical: 上から下、列は左から右 -->
	<g transform="translate(20,190)">
		<text class="cap" x="0" y="0">vertical</text>
		<rect class="sheet" x="0" y="10" width="250" height="110" />
		<rect class="cell" x="8"  y="18" width="76" height="44" />
		<rect class="cell" x="88" y="18" width="76" height="44" />
		<rect class="cell" x="168" y="18" width="74" height="44" />
		<rect class="cell" x="8"  y="68" width="76" height="44" />
		<rect class="cell" x="88" y="68" width="76" height="44" />
		<rect class="cell" x="168" y="68" width="74" height="44" />
		<text class="num" x="46"  y="40">1</text>
		<text class="num" x="126" y="40">3</text>
		<text class="num" x="205" y="40">5</text>
		<text class="num" x="46"  y="90">2</text>
		<text class="num" x="126" y="90">4</text>
		<text class="num" x="205" y="90">6</text>
		<path class="arrow" d="M46,52 L46,76" />
		<path class="arrow" d="M126,52 L126,76" />
		<path class="arrow" d="M205,52 L205,76" />
	</g>

	<!-- vertical-reverse: 上から下、列は右から左 -->
	<g transform="translate(330,190)">
		<text class="cap" x="0" y="0">vertical-reverse</text>
		<rect class="sheet" x="0" y="10" width="250" height="110" />
		<rect class="cell" x="8"  y="18" width="76" height="44" />
		<rect class="cell" x="88" y="18" width="76" height="44" />
		<rect class="cell" x="168" y="18" width="74" height="44" />
		<rect class="cell" x="8"  y="68" width="76" height="44" />
		<rect class="cell" x="88" y="68" width="76" height="44" />
		<rect class="cell" x="168" y="68" width="74" height="44" />
		<text class="num" x="46"  y="40">5</text>
		<text class="num" x="126" y="40">3</text>
		<text class="num" x="205" y="40">1</text>
		<text class="num" x="46"  y="90">6</text>
		<text class="num" x="126" y="90">4</text>
		<text class="num" x="205" y="90">2</text>
		<path class="arrow" d="M46,52 L46,76" />
		<path class="arrow" d="M126,52 L126,76" />
		<path class="arrow" d="M205,52 L205,76" />
	</g>
</svg>
