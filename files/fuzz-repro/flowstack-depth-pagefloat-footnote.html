<!--
  「flowStack深さ≠継続深さ」の最小再現(2026-08-03、seed 5 から縮小)。
  604バイト・6要素。次の4つが**すべて揃ったときだけ**落ちる——どれか1つを
  外すと通る(実測):
    1. writing-mode: vertical-lr
    2. float: top(ページフロート)
    3. float: footnote
    4. float: left
  破断時のスタックは html / body(深さ2)だが、再開後は html だけになる。
  bodyの残りが全て非フロー(フロート)なので開いた尾が空になり、
  bodyが積み直されないまま深さの検査に当たる。
-->

@page{margin:0pt}
body{font:normal 6pt/1.2 serif;writing-mode:vertical-lr}
</style></head><body>
