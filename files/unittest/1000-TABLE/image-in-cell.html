<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:tb="http://www.cssj.jp/ns/textbox">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
<style>
@page {
	margin: 0;
}
body {
  margin: 10mm;
	font-family: 'IPA明朝';
}
table {
	border: 1pt solid Red;
}
table img {
	width: 50%;
}
table.b img {
	display: block;
}
table.c img {
	float: right;
}

</style>
</head>
<body>
<table class="a" id="a"><tr>
<td><img src="../red.png" id="d"/></td>
<td><img src="../red.png"/></td>
</tr></table>

<table class="b" id="b"><tr>
<td><img src="../red.png" id="e"/></td>
<td><img src="../red.png"/></td>
</tr></table>

<table class="c" id="c"><tr>
<td><div><img src="../red.png" id="f"/></div></td>
<td><img src="../red.png"/></td>
</tr></table>
</body>
</html>
