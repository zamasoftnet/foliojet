<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>text-autospace A2: horizontal greedy</title>
<style type="text/css">
body { font-size: 12pt; margin: 0; }
p { margin: 0; }
.on { text-autospace: normal; }
</style>
</head>
<body>
<p id="off">漢<span>A</span>字<span>1</span>数</p>
<p class="on" id="on">漢<span>A</span>字<span>1</span>数</p>
<p class="on" id="numonly" style="text-autospace: ideograph-numeric">漢<span>A</span>字<span>1</span>数</p>
<p class="on" id="sp">漢 <span>A</span>字</p>
</body>
</html>
