<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>text-autospace A3: vertical</title>
<style type="text/css">
body { font-size: 12pt; margin: 0; }
div { margin: 0; }
.v { writing-mode: vertical-rl; height: 200pt; }
.on { text-autospace: normal; }
</style>
</head>
<body>
<div class="v" id="off">漢<span>A</span>字<span>1</span>数</div>
<div class="v on" id="on">漢<span>A</span>字<span>1</span>数</div>
</body>
</html>
