<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>leader() V1: vertical-rl</title>
<style type="text/css">
body { font-size: 12pt; margin: 0; writing-mode: vertical-rl; height: 200pt; }
p { margin: 0; }
.lead::after { content: leader(dotted); }
</style>
</head>
<body>
<p><span class="lead">序章</span>3</p>
<p><span class="lead">第一章</span>12</p>
</body>
</html>
