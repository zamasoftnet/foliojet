<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>TEST</title>
    <style type="text/css">
@page {
	margin: 0;
}
body {
	margin: 0;
	font: 10pt monospace;
}
li {
	font-size: 10pt;
}
/* 奇数行(1,3)を大きく、偶数行(2,4)を小さくして表示リストの
   ascent/descentの差で判別する(色はdisplay-listダンプに出ないため) */
li:nth-child(odd) {
	font-size: 20pt;
}
li:nth-child(even) {
	font-size: 8pt;
}
/* 3の倍数+1番目(1,4番目)だけ拡大 */
p {
	font-size: 10pt;
}
p:nth-of-type(3n+1) {
	font-size: 16pt;
}
/* 同種要素の最初だけ拡大 */
h2 {
	font-size: 10pt;
}
h2:first-of-type {
	font-size: 24pt;
}
     </style>
  </head>

  <body>
    <ul>
      <li id="li1">1</li>
      <li id="li2">2</li>
      <li id="li3">3</li>
      <li id="li4">4</li>
    </ul>
    <p id="p1">P1</p>
    <p id="p2">P2</p>
    <p id="p3">P3</p>
    <p id="p4">P4</p>
    <h2 id="h2a">A</h2>
    <h2 id="h2b">B</h2>
  </body>

</html>
