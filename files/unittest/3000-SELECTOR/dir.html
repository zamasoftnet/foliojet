<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>TEST</title>
    <style type="text/css">
@page {
	margin: 0;
}
body {
	margin: 0;
	font: 10pt monospace;
}
span {
	font-size: 10pt;
}
/* 色はdisplay-listダンプに出ないため、font-sizeの差で判別する */
:dir(rtl) {
	font-size: 20pt;
}
:dir(ltr) {
	font-size: 8pt;
}
     </style>
  </head>

  <body>
    <div dir="rtl">
      <span id="a">A</span>
      <div dir="ltr">
        <span id="b">B</span>
      </div>
      <span id="c">C</span>
    </div>
    <span id="d">D</span>
  </body>

</html>
