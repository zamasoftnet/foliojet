<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html lang="ja">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <style type="text/css">
li {
  display: inline-block;
  width: 100%;
}
html*li {
  display: inline;
}
html li* {
  display: inline;
}
    </style>
  </head>
  <body>
<ol>
  <li id="a">あああ</li>
  <li id="b">いいい</li>
  <li* id="c">ううう</li*>
  <li* id="d">えええ</li*>
</ol>
  </body>
</html>
