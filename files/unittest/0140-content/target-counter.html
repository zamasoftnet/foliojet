<?jp.cssj.property name="output.page-width" value="100pt"?>
<?jp.cssj.property name="output.page-height" value="100pt"?>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>target-counter</title>
    <style type="text/css">
@page {
	margin: 0;
	counter-increment: page;
}
body {
	line-height: 1;
}
h2 {
	font: 10pt/1 monospace;
}
h2 + h2 {
	page-break-before: always;
}
a {
	display: block;
}
a:before {
	content: target-counter(attr(href), page);
}
a.roman:before {
	content: target-counter(attr(href), page, upper-roman);
}
    </style>
  </head>

  <body>
    <h2 id="a">見出し</h2>
    <h2 id="b">見出し</h2>
    <h2 id="c">見出し</h2>
    <h2 id="d">見出し</h2>
    <h2 id="e">見出し</h2>
    <h2 id="f">見出し</h2>
    <h2 id="g">見出し</h2>
    <h2 id="h">見出し</h2>
    <h2 id="i">見出し</h2>
    <h2 id="j">見出し</h2>
    <a href="#a" id="aa"></a>
    <a href="#j" class="roman" id="bb"></a>
  </body>

</html>
