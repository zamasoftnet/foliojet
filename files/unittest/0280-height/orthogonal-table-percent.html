<?jp.cssj.property name="output.page-width" value="200pt"?>
<?jp.cssj.property name="output.page-height" value="200pt"?>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title></title>
    <style type="text/css">
      @page { margin: 0 }
      /* 縦組みの本文に横組みの表(直交フロー)。明示寸法の祖先が無いので、
         幅の百分率の基準はフラグメンテナ(用紙 200pt)へ落ちる
         (css-writing-modes-4 §7.3)。以前は基準が 0 になり、幅 0 の表から
         内容が紙面外へあふれていた(max-width でも同じ) */
      body { margin: 0; font: normal 8pt/1.2 serif; writing-mode: vertical-rl }
      table { border-collapse: collapse; writing-mode: horizontal-tb; width: 50% }
      table#m { width: auto; max-width: 50% }
      td { border: 1pt solid Black; padding: 0 }
    </style>
  </head>
<body>
<table id="t">
<tr>
<td>T0 T1 T2 T3 T4 T5 T6 T7 T8 T9 TA TB TC TD TE TF</td>
</tr>
</table>
<table id="m">
<tr>
<td>U0 U1 U2 U3 U4 U5 U6 U7 U8 U9 UA UB UC UD UE UF</td>
</tr>
</table>
</body>
</html>
