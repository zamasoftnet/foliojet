<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @page { size: 300px 200px; margin: 0; }
    html, body { margin: 0; padding: 0; }
    .spacer { height: 57px; }
    .outer { overflow: hidden; }
    .float { float: left; width: 210px; margin-right: 12px; margin-bottom: 8px; overflow: hidden; }
    .center { width: 200px; margin: 0 auto; }
    .link { color: blue; }
    .thumbnail { display: block; width: var(--thumbnail-width, auto); height: var(--thumbnail-height, auto); }
	/* Yahoo!ニュースではriff-inline-blockより詳細度の高い規則が勝ち、
	   実際のcomputed displayはblock、固定高親と同じ100%高になる。 */
	.root { display: block; width: 100%; height: 100%; overflow: hidden; position: relative; }
	.root::before { content: ""; position: absolute; inset: 0; background: #eee; }
    .root img { display: block; width: 200px; height: 200px; object-fit: contain; }
    .caption { margin: 0; height: 40px; line-height: 20px; }
    .text { margin: 0; line-height: 20px; }
  </style>
</head>
<body>
  <div class="spacer"></div>
  <div class="outer">
    <div class="float">
      <div class="center"><a class="link" href="#"><div class="thumbnail"
        style="--thumbnail-width:200px;--thumbnail-height:200px"><div class="root"><picture><source
		srcset="atomic-solid-red.svg"><img
        src="atomic-solid-red.svg" width="200" height="200" alt="red"></picture></div></div>
        <p class="caption">caption<br>second</p></a></div>
    </div>
    <p class="text">line 1<br>line 2<br>line 3<br>line 4<br>line 5<br>line 6<br>line 7<br>line 8<br>line 9<br>line 10</p>
  </div>
</body>
</html>
