<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    @page { size: 300px 200px; margin: 0; }
    html, body { margin: 0; padding: 0; }
    .spacer { height: 110px; }
    .float { float: left; width: 100px; margin-right: 10px; overflow: hidden; }
    .thumbnail { width: 100px; height: 100px; }
    .root { display: block; width: 100%; height: 100%; overflow: hidden; }
    .root img { display: block; width: 100%; height: 100%; }
    .caption { margin: 0; height: 40px; line-height: 20px; }
    .text { margin: 0; line-height: 20px; }
  </style>
</head>
<body>
  <div class="spacer"></div>
  <div class="float">
    <div class="thumbnail"><div class="root"><img src="atomic-solid-red.svg" alt="red"></div></div>
    <p class="caption">caption<br>second</p>
  </div>
  <p class="text">one two three four five six seven eight nine ten eleven twelve thirteen fourteen</p>
</body>
</html>
