<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>margin:auto の表のあとの浮動体が紙の外へ飛ばないこと</title>
<!--
  **欠陥(2026-08-05に修正)**: `margin: auto` の表の直後に置いた左浮動体が
  x = -(表の自動マージン) に置かれ、紙の左外へ出て消えていた。
  ここでは 280pt の版面に 66.5pt の表を中央寄せするので自動マージンは
  (280-66.5)/2 = 106.75pt。壊れているときフロートCは x=-106.75 に出る。

  原因は BlockBuilder の行方向カーソルの押し引きの非対称。積むときは
  `frame.getFrameLeft()`(自動マージン未解決=0)を足し、降ろすときに
  同じ式を**取り直して**いた(解決済み=106.75)。差の 106.75 がカーソルへ
  永久に残る。積んだ量を Flow.frameHead に覚えて、それを引くようにした。

  **clear も分割も無関係**(どちらを外しても再現した)。引き金は
  「フローの内側で解決される量」を持つ箱、ここでは margin:auto の表。
  auto マージンの**ブロック**(<p style="margin:auto">)では起きない——
  そちらは addBound で積む前に解決されるため。
-->
<style>
@page { size: 300pt 260pt; margin: 10pt }
body { margin: 0; font: 9pt serif }
div.left { clear: left; float: left; border: 6pt solid green; height: 60pt; width: 70pt }
table { border: 6pt solid red; border-collapse: separate; border-spacing: 3pt; margin: 6pt }
td { border: 6pt solid blue }
</style></head><body>
<div class="left">A</div>
<table><tr><td>t1</td><td>t1b</td></tr></table>
<div class="left">B</div>
<table style="margin:auto"><tr><td>t2</td><td>t2b</td></tr></table>
<div class="left">C</div>
<table style="width:100%"><tr><td>t3</td><td>t3b</td></tr></table>
</body></html>
