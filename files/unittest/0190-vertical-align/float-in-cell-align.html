<html>
<head>
<meta http-equiv='Content-Type' content='text/html; charset=UTF-8'>
<style>
@page {
	margin: 0;
}

body,td {
	font: 10pt/ 1 monospace;
	padding: 0;
}

body {
	margin: 0;
}

table {
	border: 5pt solid Yellow;
}

td {
	border: 5pt solid Black;
	height: 200pt;
}
td.a {
	vertical-align: top;
}

	vertical-align: bottom;
}

<body>

<table>
	<tr>
		<td class="a"><img id="a" align="left" src="../blue.png" /></td>
		<td><img id="b" align="right" src="../blue.png" /></td>
		<td class="b"><img id="c" align="left" src="../blue.png" /></td>
	</tr>
</table>

</body>
