<?jp.cssj.property name="output.page-width" value="300px"?>
<?jp.cssj.property name="output.page-height" value="100px"?>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>行間改ページ</title>
    <style type="text/css">
    @page {
      margin: 0;
    }
    body {
      border: 20px solid Red;
      margin: 0;
    }
    div {
      border: 10px solid Black;
    }
    table {
      border-collapse: collapse;
      border: 3px solid Blue;
    }
    tr {
      page-break-inside: avoid;
    }
    tr.a td {
      border: 2px solid Black;
    }
    tr.b td {
      border: 3px solid Green;
    }
    tr.c td {
      border: 3px solid Pink;
    }
    tfoot td {
      border: 3px solid Blue;
      background-color: Yellow;
    }
    </style>
  </head>

  <body>
<div>
  <table>
    <col>
    <col>
    <col style="border: 4px solid Yellow;">
    <col>
    <col>
    <tfoot>
    <tr>
      <td>フ</td>
      <td>ッ</td>
      <td>タ</td>
      <td>ー</td>
      <td>ー</td>
    </tr>
    </tfoot>
    <tr class="a">
      <td>1</td>
      <td>2</td>
      <td>3</td>
      <td>4</td>
      <td>5</td>
    </tr>
    <tr class="b">
      <td>2</td>
      <td>3</td>
      <td>4</td>
      <td>5</td>
      <td>1</td>
    </tr>
    <tr class="a">
      <td>3</td>
      <td>4</td>
      <td>5</td>
      <td>1</td>
      <td>2</td>
    </tr>
    <tr class="c">
      <td>4</td>
      <td>5</td>
      <td>1</td>
      <td>2</td>
      <td>3</td>
    </tr>
    <tr class="a">
      <td>5</td>
      <td>1</td>
      <td>2</td>
      <td>3</td>
      <td>4</td>
    </tr>
  </table>
</div>
  </body>
</html>
