<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>footnote F5: per-page numbering</title>
<style type="text/css">
body { font-size: 12pt; margin: 0; }
p { margin: 0; }
</style>
</head>
<body>
<p>A<span id="a1" style="float: footnote">note a1</span>B<span id="a2" style="float: footnote">note a2</span></p>
<p style="page-break-before: always">C<span id="b1" style="float: footnote">note b1</span>D<span id="b2" style="float: footnote">note b2</span></p>
</body>
</html>
