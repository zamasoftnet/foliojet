<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
:root { --icon-bg: #00ff00; --icon-line: #ff0000; }
body { color: #0000ff; }
.icon { fill: none; }
.icon .c { fill: var(--icon-bg); stroke: var(--icon-line); stroke-width: 2; }
.icon .cc { fill: currentColor; }
</style>
</head>
<body>
<p>SVG author CSS probe</p>
<svg class="icon" width="80" height="40" viewBox="0 0 80 40">
  <circle class="c" cx="20" cy="20" r="15"/>
  <circle class="cc" cx="60" cy="20" r="15"/>
</svg>
</body>
</html>
