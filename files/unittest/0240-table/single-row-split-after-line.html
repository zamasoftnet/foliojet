<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<?jp.cssj.property name="output.page-width" value="200pt"?>
<?jp.cssj.property name="output.page-height" value="150pt"?>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<style>
@page {
	margin: 0;
}
body {
	margin: 0;
	font: normal 10pt/1 serif;
}
div.tall {
	height: 200pt;
}
</style>
</head>
<body>
<p>X</p>
<!-- 1行だけの縦長ラッパー表。先頭ページの残量で行の内容が分割されること。
     旧実装はUA既定のセルpage-break-inside:avoidにより表全体が次ページへ
     送られ、先頭ページがほぼ白紙になっていた(kawasaki-ombuds、2026-08-27) -->
<table border="0">
<tr><td>
<p>A</p>
<div class="tall">tall</div>
<p>B</p>
</td></tr>
</table>
</body>
</html>
