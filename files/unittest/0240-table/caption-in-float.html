<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>caption range seal parity (C3)</title>
<style type="text/css">
body { font-size: 12pt; margin: 0; }
table { border-collapse: collapse; }
td { border: 1pt solid black; padding: 2pt; }
caption { text-align: left; }
</style>
</head>
<body>
<div style="float: left; width: 200pt;">
<table>
<caption>上側キャプション caption text</caption>
<tr><td>A</td><td>Bcd</td></tr>
<tr><td>efg</td><td>H</td></tr>
</table>
<table>
<caption style="caption-side: bottom">下側キャプション</caption>
<tr><td>X</td><td>Y</td></tr>
</table>
</div>
<p>flowed body text next to the float with captions inside tables.</p>
</body>
</html>
