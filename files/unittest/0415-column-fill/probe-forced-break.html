<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">
<?jp.cssj.property name="output.compatible_mode" value="copper"?>
<?jp.cssj.property name="output.page-width" value="300pt"?>
<?jp.cssj.property name="output.page-height" value="300pt"?>
<html>
<head>
<title>Balance probe: forced column break</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<style type="text/css">
@page {
	margin: 0;
}
body {
	margin: 0;
	border: 5pt solid Red;
}
div.b {
	column-count: 2;
	column-fill: balance;
	border: 5pt solid Blue;
	margin: 5pt;
	padding: 5pt;
}
p {
	margin: 0;
}
p.brk {
	page-break-before: column;
}
</style>
</head>
<body>
<div class="b" id="a">
<p>いいいいいいいいい</p>
<p>ろろろろろろろろろ</p>
<p>ははははははははは</p>
<p class="brk">にににににににに</p>
<p>ほほほほほほほほほ</p>
<p>へへへへへへへへへ</p>
<p>とととととととと</p>
<p>ちちちちちちちちち</p>
<p id="b">りりりりりりりりり</p>
</div>
</body>
</html>
