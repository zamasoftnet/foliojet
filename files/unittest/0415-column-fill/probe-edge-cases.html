<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">
<?jp.cssj.property name="output.compatible_mode" value="copper"?>
<?jp.cssj.property name="output.page-width" value="300pt"?>
<?jp.cssj.property name="output.page-height" value="300pt"?>
<html>
<head>
<title>Balance probe: edge cases (empty / single / prebuilt columns)</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<style type="text/css">
@page {
	margin: 0;
}
body {
	margin: 0;
	border: 5pt solid Red;
}
div.b {
	column-count: 2;
	column-fill: balance;
	border: 2pt solid Blue;
	margin: 5pt;
	padding: 5pt;
}
div.fixed {
	height: 60pt;
}
p {
	margin: 0;
}
</style>
</head>
<body>
<!-- 空内容(プローブは子イベントなしで不適格→legacyフォールバック) -->
<div class="b" id="e"></div>
<!-- 1段に収まる少量内容 -->
<div class="b" id="s">
<p>いいいいいいいいい</p>
</div>
<!-- ページ方向寸法が明示され、構築時に既に複数段へ分かれるケース(acc>=2) -->
<div class="b fixed" id="f">
<p>ろろろろろろろろろ</p>
<p>ははははははははは</p>
<p>にににににににに</p>
<p>ほほほほほほほほほ</p>
<p>へへへへへへへへへ</p>
<p>とととととととと</p>
<p id="b">ちちちちちちちちち</p>
</div>
</body>
</html>
