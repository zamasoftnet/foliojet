<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">

<html>
<head>
<title>Balance probe: floats inside balanced multicol (M6c-5)</title>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<style type="text/css">
@page {
	margin: 0;
}
body {
	margin: 0;
	border: 5pt solid Red;
}
div.b {
	column-count: 2;
	column-fill: balance;
	border: 5pt solid Blue;
	margin: 5pt;
	padding: 5pt;
}
p {
	margin: 0;
}
div.fw {
	float: left;
	width: 40pt;
	height: 30pt;
	border: 1pt solid Green;
}
div.aw {
	float: right;
	border: 1pt solid Purple;
}
</style>
</head>
<body>
<div class="b" id="a">
<div class="fw"></div>
<p>いいいいいいいいい いいいいいいいいい</p>
<p>ろろろろろろろろろ ろろろろろろろろろ</p>
<div class="aw">はは</div>
<p>ににににににににに ににににににににに</p>
<p>ほほほほほほほほほ ほほほほほほほほほ</p>
<p id="b">へへへへへへへへへ へへへへへへへへへ</p>
</div>
</body>
</html>
