<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>text-orientation mixed upright sideways</title>
<style type="text/css">
@page { margin: 0; size: 180pt 180pt; }
body { margin: 0; font: normal 20pt/1 serif; }
p { writing-mode: vertical-rl; display: inline-block; width: 24pt; height: 120pt; margin: 0; }
#upright { text-orientation: upright; }
#sideways { text-orientation: sideways; }
</style>
</head>
<body><p id="mixed">A1!?</p><p id="upright">A1!?</p><p id="sideways">A1!?</p></body>
</html>
