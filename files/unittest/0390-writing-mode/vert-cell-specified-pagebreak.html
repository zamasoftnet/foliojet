<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">
<?jp.cssj.property name="output.pdf.fonts.policy" value="cid-keyed"?>
<?jp.cssj.property name="output.page-width" value="200pt"?>
<?jp.cssj.property name="output.page-height" value="150pt"?>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<style>
@page {
	margin: 0;
}
body {
	font: normal 10pt/1 serif;
	margin: 0;
	-cssj-writing-mode: tb-rl;
	writing-mode: tb-rl;
}
table {
	border-collapse: collapse;
	table-layout: fixed;
}
td {
	border: 2pt solid Green;
	width: 120pt; /* 縦書きのページ軸寸法の指定(セル分割の残量計算を通す) */
	height: 60pt;
}
</style>
</head>
<body>
<table>
<tbody>
<tr>
  <td>いろはにほへとちりぬるをわかよたれそ</td>
  <td>つねならむういのおくやまけふこえて</td>
</tr>
<tr>
  <td>あさきゆめみしゑひもせす</td>
  <td>とりなくこゑすゆめさませ</td>
</tr>
</tbody>
</table>
</body>
</html>
