<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">
<?jp.cssj.property name="output.page-width" value="300pt"?>
<?jp.cssj.property name="output.page-height" value="600pt"?>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<style>
/* text-autospace既定normal化(2026-08-01)への対応: 直交セル計測の検査対象を固定するため、この検査ではoffに固定 */
body { text-autospace: no-autospace; }

@page {
	margin: 10mm;
}
body {
	font: normal 10pt/1 serif;
}
table {
	border: 10pt solid Blue;
}
td {
	border: 10pt solid Green;
}
th {
	border: 10pt solid LightBlue;
}
.h {
	-cssj-writing-mode: lr-tb;
	writing-mode: lr-tb;
}
.v {
	-cssj-writing-mode: tb-rl;
	writing-mode: tb-rl;
	border-color: Red;
}

</style>
</head>
<body>
横テーブル
<table>
<tr>
  <th class="v" id="a">縦ヘッダ1縦ヘッダ1縦ヘッダ1</th>
  <th class="h" id="b">横ヘッダ2</th>
</tr>
<tr>
  <td class="h" id="c">横セル3</td>
  <td class="v" id="d">縦セル4縦セル4縦セル4</td></tr>
</table>
</body>
</html>
