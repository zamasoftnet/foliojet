<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<style>
@page {
	size: 600pt 600pt;
	margin: 20pt;
}
html, body {
	margin: 0;
	padding: 0;
}
body {
	font: 16pt/24pt serif;
}
.sideways {
	position: absolute;
	writing-mode: sideways-lr;
	width: 32pt;
	height: 100pt;
	white-space: nowrap;
}
#basic {
	left: 20pt;
	top: 20pt;
}
#align_start {
	left: 70pt;
	top: 20pt;
	text-align: start;
}
#align_end {
	left: 120pt;
	top: 20pt;
	text-align: end;
}
#surface {
	left: 170pt;
	top: 20pt;
	height: 150pt;
	text-decoration: underline overline line-through;
	text-underline-position: under;
	text-underline-offset: 2pt;
	text-shadow: 3pt 5pt 2pt #777;
}
#framed {
	margin-inline-start: 8pt;
	padding-inline-start: 3pt;
	border-left: 2pt solid #000;
	border-right: 4pt solid #000;
}
#upright_image {
	width: 12pt;
	height: 20pt;
}
#emphasis {
	left: 240pt;
	top: 20pt;
	text-emphasis: filled circle;
	text-emphasis-position: over left;
}
#leader {
	left: 290pt;
	top: 20pt;
}
#leader .fill::after {
	content: leader(dotted);
}
#ellipsis {
	left: 340pt;
	top: 20pt;
	height: 54pt;
	overflow: hidden;
	text-overflow: ellipsis;
}
#clip_text {
	left: 390pt;
	top: 20pt;
	background: linear-gradient(red, blue);
	background-clip: text;
	color: transparent;
	filter: blur(0.5pt);
}
#ruby {
	left: 440pt;
	top: 20pt;
}
#warichu {
	left: 500pt;
	top: 20pt;
}
#warichu .note {
	-cssj-warichu: auto;
}
#logical_host {
	left: 20pt;
	top: 210pt;
	height: 120pt;
	position: absolute;
}
#logical_absolute {
	position: absolute;
	inset-inline-start: 0;
	width: 12pt;
	height: 20pt;
	background: #f00;
}
#float_host {
	left: 70pt;
	top: 210pt;
	height: 120pt;
}
#inline_float {
	float: inline-start;
	width: 12pt;
	height: 20pt;
	background: #080;
	shape-outside: circle(50%);
	shape-margin: 2pt;
}
#table {
	left: 130pt;
	top: 210pt;
	width: 64pt;
	height: 120pt;
	border-collapse: collapse;
	table-layout: fixed;
}
#table td {
	border: 1pt solid #000;
	width: 28pt;
	height: 40pt;
}
#flex {
	left: 230pt;
	top: 210pt;
	width: 40pt;
	height: 120pt;
	display: flex;
	flex-direction: row;
}
#grid {
	left: 320pt;
	top: 210pt;
	width: 40pt;
	height: 120pt;
	display: grid;
	grid-template-columns: 40pt 40pt;
}
.layout_item {
	width: 36pt;
	height: 40pt;
	border: 1pt solid #555;
}
#reset_host {
	left: 410pt;
	top: 210pt;
	height: 130pt;
}
#reset {
	writing-mode: horizontal-tb;
	width: 100pt;
	height: 28pt;
	white-space: nowrap;
}
#svg_probe {
	left: 540pt;
	top: 210pt;
}
#static_host {
	left: 500pt;
	top: 210pt;
	height: 120pt;
}
#static_block {
	position: absolute;
	width: 12pt;
	height: 20pt;
	background: #00f;
}
#align_left {
	left: 20pt;
	top: 380pt;
	text-align: left;
}
#align_right {
	left: 70pt;
	top: 380pt;
	text-align: right;
}
#align_center {
	left: 120pt;
	top: 380pt;
	text-align: center;
}
#align_justify {
	left: 170pt;
	top: 380pt;
	text-align: justify;
	text-align-last: justify;
}
#indent {
	left: 220pt;
	top: 380pt;
	text-indent: 10pt;
}
#orientation_mixed {
	left: 280pt;
	top: 380pt;
	text-orientation: mixed;
}
#orientation_upright {
	left: 330pt;
	top: 380pt;
	text-orientation: upright;
}
#orientation_sideways {
	left: 380pt;
	top: 380pt;
	text-orientation: sideways;
}
#flex_reverse {
	left: 430pt;
	top: 380pt;
	width: 40pt;
	height: 120pt;
	display: flex;
	flex-direction: row-reverse;
}
#columns {
	left: 500pt;
	top: 380pt;
	width: 60pt;
	height: 120pt;
	column-count: 2;
	column-gap: 10pt;
	column-rule: 1pt solid #000;
	column-fill: auto;
}
#column_2 {
	page-break-before: column;
}
#cw_rtl {
	position: absolute;
	left: 280pt;
	top: 510pt;
	width: 32pt;
	height: 40pt;
	writing-mode: sideways-rl;
	direction: rtl;
	text-align: start;
	white-space: nowrap;
}
#ccw_rtl {
	position: absolute;
	left: 330pt;
	top: 510pt;
	width: 32pt;
	height: 40pt;
	writing-mode: sideways-lr;
	direction: rtl;
	text-align: start;
	white-space: nowrap;
}
#cw_rtl_indent {
	position: absolute;
	left: 380pt;
	top: 510pt;
	width: 32pt;
	height: 40pt;
	writing-mode: sideways-rl;
	direction: rtl;
	text-align: start;
	text-indent: 10pt;
	white-space: nowrap;
}
.page_probe {
	writing-mode: sideways-lr;
	width: 32pt;
	height: 80pt;
	white-space: nowrap;
}
#page_two, #page_three {
	break-before: page;
}
</style>
</head>
