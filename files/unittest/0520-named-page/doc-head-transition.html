<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>named page N2b: named first content replaces the initial page</title>
<style type="text/css">
body { font-size: 12pt; margin: 0; }
p, div { margin: 0; }
@page { margin: 30pt; @top-center { content: "PLAIN"; } }
@page wide { size: landscape; @top-center { content: "WIDE"; } }
</style>
</head>
<body>
<div style="page: wide"><p>first</p></div>
<p>after</p>
</body>
</html>
