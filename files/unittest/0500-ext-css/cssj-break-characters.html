<?jp.cssj.property name="text.line-breaker" value="legacy"?>
<!-- text.line-breaker=legacy固定: このテストは「break-charactersで許可した
     分割点が実際に選ばれる」座標を検証する。K-P(optimized)は同じ候補
     集合から別の合法解を選び得るため、貪欲法の決定的挙動へ固定する
     (候補集合自体はflush生成=TextBuilder側の禁則判定で両モード共通) -->
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="ja" lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
<title>TEST</title>
</head>
<body>

<div style="border:1px solid; width: 7em; -cssj-no-break-characters: '㌫＄' '－';">
今日の相場は<span id="a">１＄</span>がロンドンで９８円５５銭<span id="b">－先</span>月と比べて<span id="c">２㌫</span>上昇しました。
</div>

<div style="border:1px solid; width: 10em; -cssj-break-characters: 'ァ ィ ゥ ェ ォ ッ ャ ュ ョ ヮ ヵ ヶ ぁ ぃ ぅ ぇ ぉ っ ゃ ゅ ょ ゎ ゕ ゖ ㇰ ㇱ ㇳ ㇲ ㇳ ㇴ ㇵ ㇶ ㇷ ㇸ ㇹ ㇺ ㇻ ㇼ ㇽ ㇾ ㇿ ';">
「トロメライ、ロマチ<span id="d">ック</span>シューマン作曲。」猫は口を拭いて済まして云いました。
</div>

</body>
</html>
