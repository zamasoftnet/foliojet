<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">
<?jp.cssj.property name="output.page-width" value="200pt"?>

<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>異常な colspan/rowspan の正規化</title>
<style>
@page { margin: 0; }
body { margin: 0; font: normal 10pt/1 serif; }
table { table-layout: fixed; width: 160pt; border-collapse: separate; border-spacing: 0; }
td { width: 80pt; height: 20pt; border: 1pt solid black; padding: 0; }
p { margin: 0; }
</style>
</head>
<body>
<table><tbody>
<tr><td colspan="0">C-ZERO</td><td rowspan="-7">R-NEG</td></tr>
<tr><td colspan="2147483648">C-OVERFLOW</td><td rowspan="x">R-NAN</td></tr>
</tbody></table>
<p id="a">AFTER</p>
</body>
</html>
