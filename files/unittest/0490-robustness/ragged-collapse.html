<title>行ごとに列数が食い違う collapse 表</title>
<style>@page{margin:0}body{margin:0;font:normal 6pt/1.2 serif}

<tr><td rowspan="3">T5</td><td>T6</td><td colspan="2">T7</td><td>T8</td></tr>

</tbody></table>
<p id="a">AFTER</p>
</body></html>
