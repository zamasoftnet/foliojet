<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>flex F2b: oversized item gets its own line</title>
<style type="text/css">
body { font-size: 12pt; margin: 0; }
div { margin: 0; }
</style>
</head>
<body>
<div id="ff" style="display: flex; flex-wrap: wrap; width: 100pt">
<div id="p" style="flex: 0 0 200pt; height: 20pt">p</div>
<div id="q" style="flex: 0 0 40pt; height: 20pt">q</div>
</div>
</body>
</html>
