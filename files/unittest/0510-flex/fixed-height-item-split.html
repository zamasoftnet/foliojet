<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/* 固定高itemを持つflex行のページ跨ぎ分割(2026-08-09)。
   FlexItemBoxはFlexBuilderが寸法を注入するためspecifiedPageAxisが
   立たず、FragmentState.ofが指定高の残量分割をスキップ——継続断片が
   指定高(60px=45pt)をフルに再解決し、ページ2の行が指定高まるごと
   膨らんでAFTERを押し下げていた(「flex丸ごと移動のreplay経路の変形」
   として記録されていた実バグ)。
   期待: ページ1に行の前断片(高さ30pt=残り紙面)、ページ2に残余
   19.5pt+下padding 6pt=25.5ptの行、AFTERはその直下(y=25.5pt)。
   TALLの合計は 25.5+19.5=45pt=指定高ちょうど。 */
@page { size: 400px 300px; margin: 0; }
body { margin: 0; font: 12px sans-serif; }
.spacer { height: 260px; }
.row { display: flex; padding: 6px 0 8px; background: #eef; }
.tall { flex: 1 1; height: 60px; background: #cfc; position: relative; }
.after { background: #ffc; }
</style>
</head>
<body>
<div class="spacer">SPACER</div>
<div class="row">
  <div class="tall">TALL</div>
  <div class="short">SHORT</div>
</div>
<div class="after">AFTER</div>
</body>
</html>
