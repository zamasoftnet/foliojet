<?jp.cssj.property name="output.page-width" value="300pt"?>
<?jp.cssj.property name="output.page-height" value="150pt"?>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>::before/::after がフレックス項目になる場合</title>
    <style type="text/css">
      @page { margin: 0; }
      body { margin: 0; font: normal 10pt/1.2 serif; }
      .outer { display: flex; }
      .f { display: flex; }
      .a::after { content: ""; display: block; width: 20pt; height: 12pt; background: #c00; }
      .real { width: 20pt; height: 12pt; background: #00c; }
    </style>
  </head>
  <body>
    <!--
      **フレックスコンテナがフレックス項目でもあるとき、子の箱が落ちる。**

      2026-08-05に真の姿が分かった。**擬似要素の問題ではない**——素の
      `<span>` でも同じく落ちる。落ちるのは「display:flex の要素が、それ自体
      別の flex コンテナの項目でもある」場合で、そのときだけ子の箱が
      **どこにも描かれず場所も取らない**(完全な消失)。明示幅を与えても
      `flex:0 0 120pt` にしても直らないので、内在寸法の問題でもない。

      `DocumentBuilder.startBox` の intake は正しい(計装で確認——
      coordinator も host も正しい内側の FlexBox を指す)。落ちているのは
      その先である。

      実地コーパス第7波(2026-08-04、mdn-svg)で見つけた。MDNのパンくずは

        .breadcrumbs li { display: flex }
        .breadcrumbs li:not(:last-child)::after { content:""; width:1.25rem; ... }

      という形で区切りの記号を ::after で置く。これが箱にならないため
      「Web SVG Reference <path>」が「WebSVGReference<path>」と
      くっついて出ていた。**フレックス+::afterで間隔や記号を作るのは
      実地で非常に多い書き方**である。

      3つの形を並べてある(いずれも赤/青の箱が20x12ptで出るのが正)。

        1. 単独のフレックスコンテナの ::after —— 2026-08-04時点で**正しい**
        2. フレックス項目でもあるフレックスコンテナの ::after ——
           **箱が丸ごと落ちる**(場所も取らない)
        3. フレックス項目である普通のブロックの ::after ——
           **場所は取るが背景が塗られない**

        4. display を明示せずブロック化に任せた場合(2と同じ形)
    -->
    <!-- 1・3 は出る。2・4 は消える(入れ子のときだけ) -->
    <div class="f a">1</div>
    <div class="outer"><div class="f a">2</div><div>x</div></div>
    <div class="f">3<span class="real"></span></div>
    <div class="outer"><div class="f">4<span class="real"></span></div><div>x</div></div>
  </body>
</html>
