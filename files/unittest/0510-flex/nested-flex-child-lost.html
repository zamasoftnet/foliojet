<?jp.cssj.property name="output.page-height" value="150pt"?>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>::before/::after がフレックス項目になる場合</title>
    <style type="text/css">
      @page { margin: 0; }
      body { margin: 0; font: normal 10pt/1.2 serif; }
      .outer { display: flex; }
      .f { display: flex; }
      .a::after { content: ""; display: block; width: 20pt; height: 12pt; background: #c00; }
      .real { width: 20pt; height: 12pt; background: #00c; }
    </style>
  </head>
  <body>
    <!--
      **【2026-08-05に修正済み】フレックスコンテナがフレックス項目でも
      あるとき、子の箱が幅0に潰れる。**

      **真の原因**: 項目の内在寸法を、その項目の**中身の寸法だけ**から
      求めており、**項目自身が宣言した幅を数えていなかった**
      (FlexBuilder.getIntrinsicSizes)。そのため `width:20pt` を持つが中身が
      空の項目は0と数えられ、内側のフレックス容器の内在寸法が「文字ぶん」
      だけになる。すると外から見た主軸の空きが負になり、**既定の
      flex-shrink で中の項目が幅0へ潰れる**。

      「消える」ように見えたが、箱は作られており高さも正しかった。
      `flex-shrink:0` か明示の basis を与えると助かる、という形で切り分けた。

      **擬似要素の問題ではない**——素の `<span>` でも同じく潰れる。
      `DocumentBuilder.startBox` の intake も正しい(計装で確認済み)。

      **診断の記録**: 「明示幅を与えても直らない」と一度書いたが誤りで、
      内側の容器に幅を与えれば直る。項目の側に `flex-shrink:0` を与えても
      直る。この2つが同時に成り立つことが、空きが負であることを示していた。

      実地コーパス第7波(2026-08-04、mdn-svg)で見つけた。MDNのパンくずは

        .breadcrumbs li { display: flex }
        .breadcrumbs li:not(:last-child)::after { content:""; width:1.25rem; ... }

      という形で区切りの記号を ::after で置く。これが箱にならないため
      「Web SVG Reference <path>」が「WebSVGReference<path>」と
      くっついて出ていた。**フレックス+::afterで間隔や記号を作るのは
      実地で非常に多い書き方**である。

      3つの形を並べてある(いずれも赤/青の箱が20x12ptで出るのが正)。

        1. 単独のフレックスコンテナの ::after
        2. フレックス項目でもあるフレックスコンテナの ::after ——**修正対象**
        3. 単独のフレックスコンテナの中の素の <span>
        4. フレックス項目でもあるフレックスコンテナの中の素の <span>
           ——**修正対象**
    -->
    <!-- 4つとも 20x12pt の箱が出るのが正 -->
    <div class="f a">1</div>
    <div class="outer"><div class="f a">2</div><div>x</div></div>
    <div class="f">3<span class="real"></span></div>
    <div class="outer"><div class="f">4<span class="real"></span></div><div>x</div></div>
  </body>
</html>
