<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/* 入れ子flexコンテナのitemの行方向寸法指定(width:50%等)。
   旧実装は非plain子の中立wrapperが寸法を引き取らず、shrink-to-fitへ
   潰れてキャプションが1文字幅の縦積みになった(asahi.comトップの
   高校野球ストリップ、2026-08-08)。
   期待: .link=400px(300pt)、キャプションは1行で収まる。
   2段目は絶対長width:200pxの入れ子flex(150pt)。 */
body { margin: 0; font: 14px sans-serif; }
div { margin: 0; padding: 0; box-sizing: border-box; }
.mod { display: flex; justify-content: space-between; width: 800px; }
.link { display: flex; align-items: center; width: 50%; background: #eef; }
.link2 { display: flex; align-items: center; width: 200px; background: #efe; }
.cap { padding-left: .5em; background: #fee; }
</style>
</head>
<body>
<div class="mod">
  <div class="link"><div class="cap">白樺学園と東日大昌平が対戦</div></div>
  <div class="link2"><div class="cap">第二試合</div></div>
</div>
</body>
</html>
