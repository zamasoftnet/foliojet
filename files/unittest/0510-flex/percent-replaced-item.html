<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/UTF-8">
    <title>%幅の置換要素のflex item(内在寸法なしsvg)</title>
    <style type="text/css">
      @page { margin: 0; }
      body { margin: 0; font-size: 12pt; }
      .rel { position: relative; }
      .row { display: flex; }
      .btn { display: grid; place-items: center; width: 26px; height: 26px;
             border: 1px solid #909091; }
      .wrap { display: flex; height: 18px; width: 18px; }
    </style>
  </head>
  <body>
    <!--
      **%幅の置換要素がflex itemのとき、中立wrapperがauthored寸法を
      引き取ること**(2026-08-09)。引き取らないとwrapperがsize:autoの
      ままflex base sizeがmaxContent=二パス計測値へ落ちる。置換要素の
      %幅は二パス計測時に基準が無く(calculateReplacedSizeがtwoPass中は
      refWidth=NONE)、内在寸法の無いsvg(viewBoxのみ・width=100%)は
      0で測られ、幅0へ潰れていた——NHKニュースのナビのシェブロンが
      空箱になった実バグの後半。position:relative祖先はcontextBox
      フォールバック経路の再現条件(これが無いと偽装的に直って見える)。
      期待: A=svgのボックスが13.5pt(=span 18pxの100%)でボタン枠の
      内側に描かれる。B=width:50%はwrapperが9pxへ解決し、子は充填で
      同じ9px=6.75pt(二重適用で4.5px=25%相当へ縮まないこと——
      LayoutUtils.calculateReplacedSizeの充填参照)。
    -->
    <div class="rel">
      <div class="row">
        <div class="btn">
          <span class="wrap"><svg width="100%" height="100%" viewBox="0 0 20 20" fill="none"
            xmlns="http://www.w3.org/2000/svg"><path
            d="M10.468 12.071C10.208 12.331 9.80499 12.331 9.54499 12.071L5.57999 8.10599C5.33299 7.85899 5.50199 7.44299 5.85299 7.44299H14.147C14.498 7.44299 14.667 7.85899 14.42 8.10599L10.468 12.071Z"
            fill="currentColor"></path></svg></span>
        </div>
        <div class="btn">
          <span class="wrap"><svg width="50%" height="50%" viewBox="0 0 20 20" fill="none"
            xmlns="http://www.w3.org/2000/svg"><path
            d="M10.468 12.071C10.208 12.331 9.80499 12.331 9.54499 12.071L5.57999 8.10599C5.33299 7.85899 5.50199 7.44299 5.85299 7.44299H14.147C14.498 7.44299 14.667 7.85899 14.42 8.10599L10.468 12.071Z"
            fill="currentColor"></path></svg></span>
        </div>
      </div>
    </div>
  </body>
</html>
