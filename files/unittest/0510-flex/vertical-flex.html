<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>flex F6: vertical writing mode</title>
<style type="text/css">
body { font-size: 12pt; margin: 0; }
div { margin: 0; }
</style>
</head>
<body>
<div style="writing-mode: vertical-rl; display: flex; width: 200pt; height: 200pt">
<div id="p" style="flex: 0 0 40pt; width: 30pt">p</div>
<div id="q" style="flex: 0 0 40pt; width: 30pt">q</div>
</div>
<div style="writing-mode: vertical-rl; display: flex; flex-direction: column; width: 200pt; height: 100pt">
<div id="v" style="flex: 0 0 40pt; height: 30pt">v</div>
<div id="w" style="flex: 0 0 40pt; height: 30pt">w</div>
</div>
</body>
</html>
