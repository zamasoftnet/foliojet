<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
/* box-sizing:border-boxのmin-width/max-widthは境界+パディング込みの
   寸法(2026-08-29)。通常フローのブロック(FlowBlockBox.calculateSize)は
   従来この換算を欠き、min-width:100px+padding-inline:8pxのブロックが
   内寸100+枠16=116px(87pt)に広がっていた。期待はどれも境界箱100px=75pt:
   (1) 50pxの容器内のmin-width:100px → 75pt(内寸84px)
   (2) 200pxの容器内のmax-width:100px → 75pt(内寸84px)
   (3) max-width:100px+border:2px → 75pt(内寸80px)
   (4) min-height:40px+padding-block:8px → 高さ30pt(内寸24px) */
body { margin: 0; font: 14px sans-serif; }
.narrow { width: 50px; }
.wide { width: 200px; }
.min { display: block; min-width: 100px; padding-inline: 8px; box-sizing: border-box; background: #36c; color: #fff; }
.max { display: block; max-width: 100px; padding-inline: 8px; box-sizing: border-box; background: #c63; color: #fff; }
.maxb { display: block; max-width: 100px; padding-inline: 8px; border: 2px solid #000; box-sizing: border-box; background: #6c3; }
.minh { display: block; width: 100px; min-height: 40px; padding-block: 8px; box-sizing: border-box; background: #fc6; }
</style>
</head>
<body>
<div class="narrow"><div class="min">MIN</div></div>
<div class="wide"><div class="max">MAX</div></div>
<div class="wide"><div class="maxb">MAXB</div></div>
<div class="wide"><div class="minh">MINH</div></div>
</body>
</html>
