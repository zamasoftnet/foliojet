<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>flex F5c: wrap-reverse flips line order</title>
<style type="text/css">
body { font-size: 12pt; margin: 0; }
div { margin: 0; }
</style>
</head>
<body>
<div style="display: flex; flex-wrap: wrap-reverse; width: 100pt">
<div id="p" style="flex: 0 0 40pt; height: 30pt">p</div>
<div id="q" style="flex: 0 0 40pt; height: 20pt">q</div>
<div id="r" style="flex: 0 0 40pt; height: 20pt">r</div>
</div>
<div id="after" style="height: 10pt">after</div>
</body>
</html>
