<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>flex F4d: column wrap (definite main+cross)</title>
<style type="text/css">
body { font-size: 12pt; margin: 0; }
div { margin: 0; }
.i { flex: 0 0 40pt; width: 50pt; }
</style>
</head>
<body>
<div style="display: flex; flex-direction: column; flex-wrap: wrap; width: 200pt; height: 100pt; align-items: flex-start; align-content: flex-start">
<div class="i" id="p">p</div>
<div class="i" id="q">q</div>
<div class="i" id="r">r</div>
</div>
</body>
</html>
