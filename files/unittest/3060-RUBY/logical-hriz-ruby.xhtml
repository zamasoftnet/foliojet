ただ、所々<ruby><rb>丹塗</rb><rp>（</rp><rt>にぬり</rt><rp>）</rp></ruby>の<ruby><rb>剥</rb><rp>（</rp><rt>は</rt><rp>）</rp></ruby>げた、大きな<ruby><rb>円柱</rb><rp>（</rp><rt>まるばしら</rt><rp>）</rp></ruby>に、<ruby><rb>蟋蟀</rb><rp>（</rp><rt>きりぎりす</rt><rp>）</rp></ruby>が一匹とまっている。
<ruby><rb id="c">快</rb><rp>（</rp><rt id="d">こころよ</rt><rp>）</rp></ruby>い
