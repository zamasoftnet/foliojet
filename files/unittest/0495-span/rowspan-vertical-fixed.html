<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<title>縦書き × table-layout:fixed × rowspan の行寸法</title>
<style>@page{margin:0}body{margin:0;font:normal 8pt/1 serif}
table{writing-mode:vertical-rl;table-layout:fixed;width:300pt;height:300pt;border-spacing:0}
td{padding:0;border:1pt solid black}p{margin:0}</style></head>
<body><table>
<tr><td rowspan="2" style="width:150pt;height:30pt">SPANWZ</td><td>S1Z</td></tr>
<tr><td>S2Z</td></tr>
</table></body></html>
