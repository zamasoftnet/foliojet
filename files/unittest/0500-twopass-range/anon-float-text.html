<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Anonymous item: float-text</title>
<style>
@page{size:360pt 420pt;margin:20pt}
body{margin:0;font:10pt/14pt serif}
.grid{display:grid;grid-template-columns:100pt 100pt;gap:5pt;width:205pt}
.flex{display:flex;gap:5pt;width:280pt}
.host{position:relative;border:1pt solid #246;margin:0 0 12pt;padding:3pt}
.item{border:1pt solid #684;padding:2pt;background:#edf}
.float{float:left;width:22pt;height:18pt;background:#cde}
</style></head><body>
<div class="grid host"><div class="float">FG</div>GRID AFTER FLOAT<div class="item">NEXT G</div>TAIL G</div>
<div class="flex host"><div class="float">FF</div>FLEX AFTER FLOAT<div class="item">NEXT F</div>TAIL F</div>
<div class="grid host">G BEFORE<div class="float">FG2</div>G AFTER<div class="item">LAST G</div></div>
<div class="flex host">F BEFORE<div class="float">FF2</div>F AFTER<div class="item">LAST F</div></div>
</body></html>
