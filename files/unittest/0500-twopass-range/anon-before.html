<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Anonymous item: before</title>
<style>
@page{size:360pt 420pt;margin:20pt}
body{margin:0;font:10pt/14pt serif}
.grid{display:grid;grid-template-columns:100pt 100pt;gap:5pt;width:205pt}
.flex{display:flex;gap:5pt;width:280pt}
.host{position:relative;border:1pt solid #246;margin:0 0 12pt;padding:3pt}
.item{border:1pt solid #684;padding:2pt;background:#edf}
.host::before{content:"BEFORE ";display:inline;color:#840}.host::after{content:" AFTER";display:inline;color:#048}
.unboxed::before{content:"ANON GENERATED ";display:contents}
</style></head><body>
<div class="grid host">GRID TEXT<div class="item">NEXT G</div>TAIL G</div>
<div class="flex host">FLEX TEXT<div class="item">NEXT F</div>TAIL F</div>
<div class="grid host unboxed">GRID TAIL<div class="item">AFTER GENERATED G</div></div>
<div class="flex host unboxed">FLEX TAIL<div class="item">AFTER GENERATED F</div></div>
</body></html>
