<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Anonymous item: generated</title>
<style>
@page{size:360pt 420pt;margin:20pt}
body{margin:0;font:10pt/14pt serif}
.grid{display:grid;grid-template-columns:100pt 100pt;gap:5pt;width:205pt}
.flex{display:flex;gap:5pt;width:280pt}
.host{position:relative;border:1pt solid #246;margin:0 0 12pt;padding:3pt}
.item{border:1pt solid #684;padding:2pt;background:#edf}
.contents{display:contents}.contents::after{content:attr(data-tail);color:#840}
</style></head><body>
<div class="grid host"><span class="contents" data-tail=" GENERATED G">GRID<br>LINE</span><div class="item">NEXT G</div>TAIL G</div>
<div class="flex host"><span class="contents" data-tail=" GENERATED F">FLEX<br>LINE</span><div class="item">NEXT F</div>TAIL F</div>
</body></html>
