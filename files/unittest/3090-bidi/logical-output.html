<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<style>
@page { size: 360pt 500pt; margin: 20pt }
body { margin: 0; font: 16pt serif }
p { margin: 0 0 12pt; width: 300pt }
#shadow { text-shadow: 2pt 1pt #888 }
#blur { text-shadow: 2pt 1pt 3pt #888 }
#filter { filter: blur(1pt) }
</style>
</head>
<body>
<p id="rtl" dir="rtl">אבג ABC</p>
<p id="shadow" dir="rtl">אבג SHADOW</p>
<p id="blur" dir="rtl">אבג BLUR</p>
<p id="filter" dir="rtl">אבג FILTER</p>
</body>
</html>
