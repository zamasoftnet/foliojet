<html>

    <title>text-shadowのオフセット</title>
  </head>

  <body>
    <h1>text-shadowのオフセット</h1>
    <div id="a" style="text-shadow: 2pt 3pt red">横2pt縦3ptの影</div>
    <div id="b" style="text-shadow: 0 1pt rgba(0,0,0,.3)">横0縦1ptの影(reveal.jsのコード配色)</div>
    <div id="c" style="text-shadow: 4pt 0 blue">横4pt縦0の影</div>
  </body>

</html>
