<!DOCTYPE html>
<?jp.cssj.property name="output.page-width" value="400pt"?>
<?jp.cssj.property name="output.page-height" value="400pt"?>
<html>
<head>
<meta charset="UTF-8" />
<title>grid: subgrid(css-grid-2)——親の列線を継ぐ</title>
<!--
  2026-08-29: grid-template-columns: subgrid のgridは、親gridの跨ぐ列の
  解決済み幅・gap・線名を自分のトラックにする(GridBuilder.resolveSubgrid)。
  親は 100pt 100pt 100pt、gap 10pt、幅320pt。

  #s1 .sub(span 2、subgrid)のitemは親の線に揃う: x=0 w=100、x=110 w=100。
      3列目の .c は x=220
  #s2 .sub2(2 / span 2、padding 0 5pt、subgrid [a] [b] [c]): 自分の縁は
      先頭・末尾トラックに食い込む → 内側の線は親と同じ x=220。
      auto配置の item は x=115 w=95、grid-column: b / c の item は x=220 w=95
  #s3 .wrap の中の .sub3 は item直下でないため継げない(単一autoの近似
      =2つのitemが縦に積まれる。クラスjavadocの(b))
-->
<style>
@page {
	margin: 0;
}
body {
	margin: 0;
	font-size: 10pt;
	line-height: 12pt;
	font-family: serif;
}
div {
	margin: 0;
}
.g {
	display: grid;
	grid-template-columns: 100pt 100pt 100pt;
	column-gap: 10pt;
	width: 320pt;
	margin-bottom: 8pt;
	background: #eee;
}
.g > div {
	background: #fcc;
}
.sub, .sub2, .sub3 {
	display: grid;
	grid-template-columns: subgrid;
	background: #dfd;
}
.sub > div, .sub2 > div, .sub3 > div {
	background: #ccf;
	height: 12pt;
}
.sub { grid-column: span 2; }
.sub2 { grid-column: 2 / span 2; padding: 0 5pt; grid-template-columns: subgrid [a] [b] [c]; }
.sub2 > .named { grid-column: b / c; }
.wrap { grid-column: span 2; }
</style>
</head>
<body>
<div class="g" id="s1"><div class="sub"><div>1</div><div>2</div></div><div class="c">c</div></div>
<div class="g" id="s2"><div class="a">a</div><div class="sub2"><div>1</div><div class="named">2</div></div></div>
<div class="g" id="s3"><div class="wrap"><div class="sub3"><div>1</div><div>2</div></div></div><div class="c">c</div></div>
<div id="after">after</div>
</body>
</html>
