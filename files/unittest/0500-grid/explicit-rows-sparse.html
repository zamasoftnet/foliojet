<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>grid G4c: explicit rows with sparse auto</title>
<style type="text/css">
body { font-size: 12pt; margin: 0; }
div { margin: 0; }
#g > div > div { background: #ccc; }
</style>
</head>
<body>
<div id="g" style="display: grid; grid-template-columns: 60pt 60pt; column-gap: 10pt; row-gap: 5pt; width: 200pt">
<div id="a" style="grid-row: 2"><div style="width: 40pt; height: 20pt"></div></div>
<div id="b" style="grid-row: 2"><div style="width: 30pt; height: 25pt"></div></div>
<div id="c" style="grid-column: 2"><div style="width: 30pt; height: 15pt"></div></div>
<div id="d"><div style="width: 30pt; height: 10pt"></div></div>
</div>
<div id="after">after</div>
</body>
</html>
