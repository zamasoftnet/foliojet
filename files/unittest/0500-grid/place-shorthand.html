<?jp.cssj.property name="output.page-height" value="300pt"?>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/UTF-8">
    <title>place-items / place-self / place-content ショートハンド</title>
    <style type="text/css">
      @page { margin: 0; }
      body { margin: 0; font-size: 10pt; line-height: 12pt; }
      .g { display: grid; width: 120pt; height: 60pt; background: #eef; margin-bottom: 6pt; }
      .item { width: 30pt; height: 12pt; background: #cfc; }
    </style>
  </head>
  <body>
    <!--
      **place-items / place-self / place-content ショートハンド**
      (2026-08-09)。<align> [<justify>]の1〜2値、1値なら両方に適用
      (CSS Box Alignment §6.4)。longhand(justify-*/align-*)は対応済み
      だったが、ショートハンドが宣言無効になっており、NHKニュースの
      ナビのボタン(place-items:center)でアイコンが左上に寄っていた。
      期待:
      A: place-items:center → itemがグリッド中央(x=45,y=24)。
      B: place-items:end center → 縦end・横center(x=45,y=48)。
      C: place-self:end(item側) → 右下(x=90,y=48)。
      D: place-content:center(単一auto行のトラック群を中央へ) →
         トラックが縦中央から始まる。
    -->
    <div class="g" style="place-items: center">
      <div class="item">A</div>
    </div>
    <div class="g" style="place-items: end center">
      <div class="item">B</div>
    </div>
    <div class="g">
      <div class="item" style="place-self: end">C</div>
    </div>
    <div class="g" style="place-content: center">
      <div class="item">D</div>
    </div>
  </body>
</html>
