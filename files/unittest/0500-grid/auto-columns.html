<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>grid G3b: auto column</title>
<style type="text/css">
body { font-size: 12pt; margin: 0; }
div { margin: 0; }
</style>
</head>
<body>
<div id="g" style="display: grid; grid-template-columns: 80pt auto; column-gap: 10pt; row-gap: 5pt; width: 300pt">
<div id="a"><div style="width: 60pt; height: 20pt; background: #ccc"></div></div>
<div id="b"><div style="width: 70pt; height: 30pt; background: #ccc"></div></div>
<div id="c"><div style="width: 40pt; height: 20pt; background: #ccc"></div></div>
<div id="d"><div style="width: 50pt; height: 25pt; background: #ccc"></div></div>
</div>
<div id="after">after</div>
</body>
</html>
