<!DOCTYPE html>

<head>

<title>grid G4c: empty rows keep gaps</title>

body { font-size: 12pt; margin: 0; }
div { margin: 0; }
</style>

<body>
<div id="g" style="display: grid; grid-template-columns: 60pt; row-gap: 8pt; width: 60pt">

</div>
<div id="after">after</div>
</body>
