<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>grid G1: fixed 2x2 placement</title>
<style type="text/css">
body { font-size: 12pt; margin: 0; }
div { margin: 0; }
</style>
</head>
<body>
<div id="g" style="display: grid; grid-template-columns: 100pt 100pt; column-gap: 20pt; row-gap: 10pt; width: 220pt">
<div id="a" style="height: 30pt">a</div>
<div id="b" style="height: 50pt">b</div>
<div id="c" style="height: 20pt">c</div>
<div id="d" style="height: 40pt">d</div>
</div>
<div id="after">after</div>
</body>
</html>
