  <div>
我国の軍隊は世々天皇の統率し給ふ所にそある昔神武天皇躬つから大伴物部の兵ともを率ゐ中国のまつろはぬ
ものともを討ち平け給ひ高御座に即かせられて天下しろしめし給ひしより二千五百有余年を経ぬ此間世の様の
移り換るに随ひて兵制の沿革も亦屡なりき古は天皇躬つから軍隊を率ゐ給ふ御制にて時ありては皇后皇太子の
代らせ給ふこともありつれと大凡兵権を臣下に委ね給ふことはなかりき中世に至りて文武の制度皆唐国風に傚
はせ給ひ六衛府を置き左右馬寮を建て防人なと設けられしかは兵制は整ひたれとも打続ける昇平に狃れて<span id="a">朝廷</span>
  </div>
