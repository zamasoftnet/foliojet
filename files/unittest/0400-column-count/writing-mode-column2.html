<p>
<ruby>河童<rt>かっぱ</ruby>は、日本の妖怪・伝説上の動物、または未確認動物。
標準和名の「かっぱ」は、「かわ（川）」に「わらは（童）」の変化形「わっぱ」が複合した「かわわっぱ」が変化したもの。
<ruby>河太郎<rt>かわたろう</ruby>とも言う。
ほぼ日本全国で伝承され、その呼び名や形状も各地方によって異なる。
