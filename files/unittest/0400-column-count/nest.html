<div>
我国の軍隊は世々天皇の統率し給ふ所にそある昔神武天皇躬つから大伴物部の兵ともを率ゐ中国のまつろはぬ
ものともを討ち平け給ひ高御座に即かせられて天下しろしめし給ひしより二千五百有余年を経ぬ此間世の様の
<div>
<span id="a">治とはな</span>りぬ世の様の移り換りて斯なれるは人力もて挽回すへきにあらすとはいひなから且は我国体に戻り且
は我祖宗の御制に背き奉り浅間しき次第なりき降りて弘化嘉永の頃より徳川の幕府其政衰へ剰外国の事とも起
</div>
々孫々に至るまて篤く斯旨を伝へ天子は文武の大権を掌握するの義を存して再中世以降の如き失体な<span id="b">からんこ</span>
</div>
