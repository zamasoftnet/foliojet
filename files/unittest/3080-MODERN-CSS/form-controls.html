<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>TEST</title>
    <style type="text/css">
@page {
	margin: 0;
}
body {
	margin: 0;
	font: 10pt monospace;
	line-height: 12pt;
}
p { margin: 0; }
/* 実サイトのボタンによくある形(内側余白+境界+背景) */
button.styled {
	padding: 4pt 8pt;
	border: 1pt solid black;
	background-color: #dddddd;
}
    </style>
  </head>

  <body>
    <p><button type="button">BTN</button></p>
    <p><button type="button" class="styled">STYLED</button></p>
    <p><input type="text" value="TEXT" size="8" /></p>
    <p><input type="checkbox" checked="checked" />CHK</p>
    <p><select><option>OPT</option></select></p>
    <p><textarea rows="2">AREA</textarea></p>
  </body>

</html>
