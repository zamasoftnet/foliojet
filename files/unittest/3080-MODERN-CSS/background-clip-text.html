<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
/* background-clip: text (2026-10-09). The pixels that BackgroundClipTextTest checks were measured in Chrome 151 too. */
@page { size: 300pt 300pt; margin: 0; }
body { margin: 0; font-family: sans-serif; }
.g { -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
/* Block: red on the left half of the box, blue on the right; the text ends before the box does */
#block { position: absolute; left: 10pt; top: 10pt; width: 180pt; height: 60pt; font-size: 30pt; line-height: 60pt;
  background-image: linear-gradient(90deg, rgb(255,0,0) 50%, rgb(0,0,255) 50%); }
/* Inline over two lines, after unclipped text */
#para { position: absolute; left: 10pt; top: 90pt; width: 120pt; font-size: 20pt; line-height: 30pt; margin: 0; }
#inline { background-color: rgb(0,160,0); }
/* Vertical: red on the top half, blue on the bottom */
#vertical { position: absolute; left: 250pt; top: 10pt; width: 30pt; height: 200pt; font-size: 20pt;
  writing-mode: vertical-rl; background-image: linear-gradient(rgb(255,0,0) 50%, rgb(0,0,255) 50%); }
/* Transparent text without a clip: stays invisible but extractable, also where PDF has no transparency */
#hidden { position: absolute; left: 10pt; top: 230pt; font-size: 20pt; margin: 0; }
#hidden span { color: transparent; }
/* A transparent stroke color stopped the conversion until the same day */
#stroke { position: absolute; left: 200pt; top: 230pt; font-size: 12pt; margin: 0; -webkit-text-stroke: 1px transparent; }
/* Two columns: the text of each column is clipped where it is drawn */
#cols { position: absolute; left: 10pt; top: 258pt; width: 180pt; columns: 2; column-gap: 20pt; font-size: 18pt;
  line-height: 20pt; background-image: linear-gradient(90deg, rgb(255,0,0) 50%, rgb(0,0,255) 50%); }
</style></head><body>
<div id="block" class="g">HHHHHH</div>
<p id="para">ab <span id="inline" class="g">MMMM MMMM</span></p>
<div id="vertical" class="g">HHHHHHHH</div>
<p id="hidden">A<span>HIDDEN</span>B</p>
<p id="stroke">S</p>
<div id="cols" class="g">AAAA AAAA BBBB BBBB</div>
</body></html>
