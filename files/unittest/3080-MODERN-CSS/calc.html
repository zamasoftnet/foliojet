<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>TEST</title>
    <style type="text/css">
@page {
	margin: 0;
}
body {
	margin: 0;
	font: 10pt monospace;
}
div {
	display: block;
}
#container {
	width: 300pt;
}
#calcadd {
	/* calc(50% + 20pt) = 0.5*300 + 20 = 170pt */
	width: calc(50% + 20pt);
	background-color: #ff0000;
}
#calcsub {
	/* calc(100% - 50pt) = 300 - 50 = 250pt */
	width: calc(100% - 50pt);
	background-color: #00ff00;
}
#calcmin {
	/* min(200pt, 90pt) = 90pt。
	   注: min()/max()/clamp()は現状、絶対長さと割合が混在する引数
	   (例: min(200pt, 30%))には対応していない(基準値なしに静的比較
	   できないため。calc()自体の絶対長さ+割合混在はMIXED型で対応済みだが、
	   min/max/clampの引数間比較はまだ対応していない。docs/PLAN.md参照)。
	   同じ単位系の引数同士であれば問題なく動作する。 */
	width: min(200pt, 90pt);
	background-color: #0000ff;
}
#calcmax {
	/* max(50pt, 180pt) = 180pt */
	width: max(50pt, 180pt);
	background-color: #ffff00;
}
#calcclamp {
	/* clamp(50pt, 270pt, 150pt) = 150pt(上限にクランプ) */
	width: clamp(50pt, 270pt, 150pt);
	background-color: #ff00ff;
}
    </style>
  </head>

  <body>
    <div id="container">
      <div id="calcadd">CALCADD</div>
      <div id="calcsub">CALCSUB</div>
      <div id="calcmin">CALCMIN</div>
      <div id="calcmax">CALCMAX</div>
      <div id="calcclamp">CALCCLAMP</div>
    </div>
  </body>

</html>
