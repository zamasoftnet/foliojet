<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
@page{size:320pt 420pt;margin:10pt}
body{margin:0;font-family:sans-serif;font-size:12px}
.wrap{display:flow-root;border:1px solid #000;margin-bottom:8px}
.wrap .f{float:left;width:60px;height:40px;background:#0af}
.alpha{background-color:#ff000080;color:#00f8;padding:4px;margin-bottom:8px}
.outer{padding:6px 12px;background:#eee;margin-bottom:8px}
.outer .in{padding:inherit;background:#cfc}
.narrow{width:70px;border:1px solid #888;word-break:break-word;margin-bottom:8px}
.centered{width:100px;margin-inline:auto;background:#fc8;margin-bottom:8px}
.mask{width:48px;height:48px;background-color:#c00;-webkit-mask:url(mask-image-url.svg) no-repeat center / contain;margin-bottom:8px}
.bg{width:120px;height:60px;border:1px solid #888;background:#fff url(../kappa.png) right 10px bottom 5px / 20px no-repeat;margin-bottom:8px}
.kern{font-kerning:none}
.iso{unicode-bidi:isolate;direction:rtl}
.col{-webkit-column-count:2;column-gap:10px;border:1px dotted #888}
.col p{-webkit-column-break-inside:avoid;margin:0 0 4px}
</style></head><body>
<!-- 実サイトの警告から拾った穴(2026-08-29)をまとめて固定する。
     flow-rootはfloatを内包して高さに含める / 8桁hexは半透明として描く /
     padding:inheritは親と同じ余白 / word-break:break-wordは長い語を折る /
     margin-inline:autoは中央寄せ / -webkit-maskは型抜き位置と寸法 /
     background 4値position + サイズ / font-kerning / isolate / ベンダ段組 -->
<div class="wrap"><div class="f"></div>flow-root</div>
<div class="alpha">alpha</div>
<div class="outer"><div class="in">inherit</div></div>
<div class="narrow">Supercalifragilisticexpialidocious</div>
<div class="centered">center</div>
<div class="mask"></div>
<div class="bg"></div>
<p class="kern">AVAWAY Tokyo</p>
<p><span class="iso">abc</span> def</p>
<div class="col"><p>one two three four</p><p>five six seven eight</p><p>nine ten</p></div>
</body></html>
