<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<title>text-shadow</title>
<style>
/*
 * 上の text-shadow-vertical.html から影だけを外した対照文書。
 * 縦組み+圏点だと描画単位が1文字ごとに割れ、影と本体が交互に出ていた。
 */
@page { size: 300pt 400pt; margin: 10pt; }
body { margin: 0; font-family: serif; font-size: 16pt; }
p { margin: 0 0 6pt 0; }
#sharp { /* 影なし(対照) */ }
#blurred { /* 影なし(対照) */ }
#vertical-emphasis {
	writing-mode: vertical-rl;
	text-emphasis: "●";
	/* 影なし(対照) */
}
</style>
</head>
<body>
<p id="sharp">減税</p>
<p id="blurred">社会</p>
<p id="vertical-emphasis">保障</p>
</body>
</html>
