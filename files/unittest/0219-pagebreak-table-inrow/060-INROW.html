<?jp.cssj.property name="output.page-width" value="300px"?>
<?jp.cssj.property name="output.page-height" value="100px"?>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>行内改ページ</title>
    <style type="text/css">
    @page {
      margin: 0;
    }
    body {
      border: 20px solid Red;
      margin: 0;
    }
    div {
      border: 10px solid Black;
    }
    table {
      border: 2px solid Blue;
      border: 3px solid Blue;
      background-color: LightBlue;
    }
    td {
      page-break-inside: auto;
    }
    col.a {
      border: 3px solid Yellow;
      background-color: Khaki;
    }
    td {
      border: 3px solid Green;
    }
    </style>
  </head>

  <body>
<div>
  <table>
    <col>
    <col class="a">
    <col>
    <tr>
      <td>
青葉しげれる桜井の　里のわたりの夕まぐれ<br />
木下陰に駒とめて　世の行く末をつくづくと<br />
偲ぶ鎧の袖の上に　散るは涙か　はた露か<br />
      </td>
      <td>
正成涙を打ち払い　我が子正行呼び寄せて<br />
父は兵庫に赴かん　彼方の浦にて討ち死にせん<br />
今しは　ここまで来つれども　とくとく帰れ故郷へ<br />
      </td>
      <td>
父上いかにのたもうも　見捨てまつりて我一人<br />
いかで帰らん帰られん　この正行は年こそは<br />
未だ若けれ諸共に　御供つかえん死出の旅<br />
      </td>
    </tr>
  </table>
</div>
  </body>
</html>
