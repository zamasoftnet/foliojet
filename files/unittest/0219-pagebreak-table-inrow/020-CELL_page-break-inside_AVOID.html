<?jp.cssj.property name="output.page-height" value="200px"?>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>行内改ページ</title>
    <style type="text/css">
    @page {
      margin: 0;
    }
    body {
      border: 20px solid Red;
      margin: 0;
    }
    table {
      border: 2px solid Blue;
      border: 3px solid Blue;
      background-color: LightBlue;
    }
    td {
      page-break-inside: auto;
    }
    td {
      border: 3px solid Green;
      widows: 2;
      orphans: 2;
    }
    </style>
  </head>

  <body>
  <p>
セルを切断できないので次ページに持ち越します。
  </p>

  <table>
    <tr>
      <td>
widows: 2; orphans: 2;<br />
青葉しげれる桜井の　里のわたりの夕まぐれ<br />
木下陰に駒とめて　世の行く末をつくづくと<br />
偲ぶ鎧の袖の上に　散るは涙か　はた露か
      </td>
      <td style="page-break-inside: avoid;">
page-break-inside: avoid;
      </td>
    </tr>
  </table>

  </body>
</html>
