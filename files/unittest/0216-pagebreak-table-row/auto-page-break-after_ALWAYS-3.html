<?jp.cssj.property name="output.page-width" value="300pt"?>
<?jp.cssj.property name="output.page-height" value="120pt"?>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>行間改ページ</title>
    <style type="text/css">
    @page {
      margin: 0;
    }
    body {
      border: 20pt solid Red;
      margin: 0;
    }
    * {
      font: 10pt/1 monospace;
    }
    div {
      border: 10pt solid Black;
    }
    table {
      border: 2pt solid Blue;
      border: 3pt solid Blue;
      width: 100%;
    }
    td {
      border: 2pt solid Black;
   }
    tr {
      background-color: LightBlue;
    }
    tr.a {
      page-break-after: always;
      background-color: Yellow;
    }
    </style>
  </head>

  <body>
<div>
  <p>
背景が黄色い列の後で強制改ページします。
  </p>
  <table>
    <tr>
      <td>2</td>
      <td>3</td>
      <td>4</td>
      <td>5</td>
      <td>1</td>
    </tr>
    <tr id="a" class="a">
      <td>3</td>
      <td>4</td>
      <td>5</td>
      <td>1</td>
      <td>2</td>
    </tr>
    <tr id="b">
      <td>4</td>
      <td>5</td>
      <td>1</td>
      <td>2</td>
      <td>3</td>
    </tr>
    <tr class="a">
      <td>3</td>
      <td>4</td>
      <td>5</td>
      <td>1</td>
      <td>2</td>
    </tr>
    <tr id="c">
      <td>4</td>
      <td>5</td>
      <td>1</td>
      <td>2</td>
      <td>3</td>
    </tr>
    <tr>
      <td>2</td>
      <td>3</td>
      <td>4</td>
      <td>5</td>
      <td>1</td>
    </tr>
  </table>
</div>
  </body>
</html>
