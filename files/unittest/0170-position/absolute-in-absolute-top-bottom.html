<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>test</title>
<style type="text/css">
@page {
	margin: 0;
}
body, td {
	margin: 0;
	font: 10pt/1 monospace;
    padding: 0;
}
div.abs {
	position: absolute;
	border: 5pt solid Blue;
}

div.a1 {
	width: 200pt;
}

div.a2 {
	top: 30pt;
	bottom: 30pt;
	left: 30pt;
	right: 30pt;
}

div.flow {
	border: Green 5pt solid;
	margin: 1em;
	padding: 1em;
}

div.a2 div.float {
	float: right;
}

.a {
	position: absolute;
	top: 0;
	right: 0;
	border: Red 5pt solid;
}

.b {
	position: absolute;
	top: 0;
	left: 0;
	border: Yellow 5pt solid;
}

.c {
	position: absolute;
	bottom: 0;
	left: 0;
	border: Brown 5pt solid;
}

.d {
	position: absolute;
	bottom: 0;
	right: 0;
	border: Pink 5pt solid;
}
img {
	width: 10pt;
	height: 10pt;
}
</style>
</head>

<body>
<div class="abs a1">
<div class="abs a2">
<div class="flow">
フロー
<img src="../red.png" class="a" id="aa" />
<img src="../blue.png" class="b" id="ab" />
</div>
<div class="flow float">
右浮動
<img src="../red.png" class="c" id="ac" />
</div>
<img src="../blue.png" class="d" id="ad" />
</div>

<div class="flow">
フロー
<div class="a" id="ba">右上</div>
<div class="b" id="bb">右下</div>
</div>
フロー
<div class="c" id="bc">左上</div>
<div class="d" id="bd">右下</div>
<div class="flow">
フロー
</div>
<div class="flow">
フロー
</div>
</div>
</body>

</html>
