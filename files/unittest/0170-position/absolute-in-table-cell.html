<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>test</title>
<style type="text/css">
@page {
	margin: 0;
}
body, td {
	margin: 0;
	font: 10pt/1 monospace;
    padding: 0;
}
td {
	border: 5pt solid Blue;
	width: 200pt;
}

div.flow {
	border: Green 5pt solid;
	margin: 1em;
	padding: 1em;
}

.a {
	position: absolute;
	top: 0;
	right: 0;
	border: Red 5pt solid;
}

.b {
	position: absolute;
	top: 0;
	left: 0;
	border: Yellow 5pt solid;
}

.c {
	position: absolute;
	bottom: 0;
	left: 0;
	border: Brown 5pt solid;
}

.d {
	position: absolute;
	bottom: 0;
	right: 0;
	border: Pink 5pt solid;
}
img {
	width: 10pt;
	height: 10pt;
}
</style>
</head>

<body>
<table><tr>
<td>
<div class="flow">
フロー
<div class="a" id="aa">右上</div>
<div class="b" id="ab">右下</div>
</div>
フロー
<div class="c" id="ac">左上</div>
<div class="d" id="ad">右下</div>
</td>
</tr>

<tr>
<td>
<div class="flow">
フロー
<img src="../red.png" class="a" id="ba" />
<img src="../blue.png" class="b" id="bb" />
</div>
フロー
<img src="../red.png" class="c" id="bc" />
<img src="../blue.png" class="d" id="bd" />
</td>
</tr></table>
</body>

</html>
