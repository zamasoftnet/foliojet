<?jp.cssj.property name="output.page-width" value="200pt"?>
<?jp.cssj.property name="output.page-height" value="150pt"?>
<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN">
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>TEST</title>
    <style type="text/css">
/* CSSからトンボと断ち代を指定する(従来はoutput.marks/output.trims等の
   入出力プロパティからしか触れなかった)。紙面は断ち代の分だけ広がり、
   版面(内容)はその内側へ寄る */
@page {
	size: 100pt 80pt;
	margin: 5pt;
	marks: crop cross;
	bleed: 6pt;
}
body {
	margin: 0;
	font: 10pt monospace;
	line-height: 12pt;
}
p {
	margin: 0;
	background-color: #cccccc;
}
    </style>
  </head>

  <body>
    <p>MARKS</p>
  </body>

</html>
