      div.b {

      }
      img.b {
        display: inline-block;
      }
      div.c:before {
      	content: 'text';
      }

<body>
<div class="a"><span id="a">outside</span></div>
<div class="b"><span id="b">inside</span></div>

<div class="b"><img class="a" src="../red.png" /><span id="d">inside</span></div>
<div class="a"><img class="b" src="../blue.png" /><span id="e">outside</span></div>
<div class="b"><img class="b" src="../red.png" /><span id="f">inside</span></div>
