<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
@page { size: 600px 1400px; margin: 0; }
html, body { margin: 0; padding: 0; }
body { width: 600px; font: 16px/1.25 serif; }
.box { border-top: 1px solid; }
.v { writing-mode: vertical-rl; height: 200px; }
</style></head><body>
<!-- The indent of a list is padding-inline-start: 40px, of dd margin-inline-start: 40px; lists have 1em above and below,
     none in a list (HTML Standard, Chrome 151; 2026-10-09). Chrome, px from the page: t1 t2 t5 t6 t6b at x 40 (l1 l2 l5
     l6 l6b at 0), t3 at 0, l4b at 40 and t4b at 80 right below t4's line, t7 at 80; l1 16 below its box's border, l2 0;
     vertical: t8 40 below l8 -->
<div class="box" id="b1"><ul id="l1"><li id="t1">default</li></ul></div>
<div class="box" id="b2"><ul id="l2" style="margin: 0"><li id="t2">margin 0</li></ul></div>
<div class="box" id="b3"><ul id="l3" style="padding-left: 0"><li id="t3">padding-left 0</li></ul></div>
<div class="box" id="b4"><ul id="l4"><li id="t4">outer<ol id="l4b"><li id="t4b">inner</li></ol></li></ul></div>
<div class="box" id="b5"><dl id="l5"><dt id="t5a">term</dt><dd id="d5"><span id="t5" style="display: inline-block">desc</span></dd></dl></div>
<div class="box" id="b6"><menu id="l6"><li id="t6">menu</li></menu><dir id="l6b"><li id="t6b">dir</li></dir></div>
<div class="box" id="b7"><ol id="l7"><li id="t7a">one<ul id="l7b"><li id="t7">two</li></ul></li></ol></div>
<div class="box v" id="b8"><ul id="l8"><li id="t8">縦</li></ul></div>
</body></html>
