<!DOCTYPE html>
<html><head><style>
@page { size: 300pt 120pt; margin: 10pt; }
body { margin: 0; font-family: Helvetica, sans-serif; font-size: 20pt; line-height: 24pt; }
div { width: 100pt; height: 24pt; white-space: nowrap; margin-bottom: 6pt; }
#ellipsis { overflow: hidden; text-overflow: ellipsis; }
#clip { overflow: hidden; }
#visible { overflow: visible; text-overflow: ellipsis; }
</style></head><body>
<div id="ellipsis">MMMMMMMMMMMMMMMMMMMM</div>
<div id="clip">MMMMMMMMMMMMMMMMMMMM</div>
<div id="visible">MMMMMMMMMMMMMMMMMMMM</div>
</body></html>
