<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<style>
@page {
	margin: 0;
}

body,td {
	font: normal 10pt/1 serif;
}

body {
	margin: 0;
}
div#a,
div#b {
	margin: 10pt;
	padding: 10pt;
	border: 1pt solid Red;
	background-color: LightBlue;
}
div#a {
	overflow: hidden;
}
div.a {
	float: left;
	width: 100pt;
	border: 1pt solid Blue;
	background-color: Pink;
}
</style>
</head>
<body>
<div id="a">
<div class="a">外側のボックスはhiddenだけど、浮動ボックスは消えない。</div>
</div>
<div id="b">
<div class="a">外側のボックスはhiddenだけど、浮動ボックスは消えない。</div>
</div>
</body>
