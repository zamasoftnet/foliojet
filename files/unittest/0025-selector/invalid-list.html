<?jp.cssj.property name="output.page-width" value="400pt"?>
<?jp.cssj.property name="output.page-height" value="300pt"?>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>無効セレクタを含むリストの規則ごと破棄</title>
    <style type="text/css">
      @page { margin: 0; }
      body { margin: 0; font-size: 10pt; line-height: 12pt; }
      /* 未知の擬似クラスを含むリストは規則ごと無効(Safariハックの形。
         2026-08-09、pc.watch.impress.co.jpの
         _::-webkit-full-page-media,_:future,:root body #page-wrap で実測) */
      _:future, .a { display: none; }
      /* -webkit-接頭辞の擬似要素は名前を問わず妥当(一致しないだけ)
         ——CSS仕様のウェブ互換特例。リストは生きるので.bは消える */
      _::-webkit-full-page-media, .b { display: none; }
      /* :is()の引数はforgiving——無効な引数だけ落ち、.dには適用される */
      :is(:future, .d) { display: none; }
      /* :not()の引数は非forgiving——規則ごと無効で.eは残る */
      .e:not(:future) { display: none; }
      /* -webkit-以外の未知の擬似要素はリストごと無効で.fは残る */
      .f::-moz-selection, .f { display: none; }
      /* 対照: 普通の規則は当然適用される */
      .g { display: none; }
    </style>
  </head>
  <body>
    <div class="a">A-VISIBLE</div>
    <div class="b">B-HIDDEN</div>
    <div class="d">D-HIDDEN</div>
    <div class="e">E-VISIBLE</div>
    <div class="f">F-VISIBLE</div>
    <div class="g">G-HIDDEN</div>
  </body>
</html>
