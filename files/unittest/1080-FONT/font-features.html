<!DOCTYPE html>
<?jp.cssj.property name="output.pdf.fonts.policy" value="embedded"?>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<title>font-feature-settings / font-variant-east-asian</title>
<style type="text/css">
/* text-autospace既定normal化(2026-08-01)への対応: font featureの幅をそのまま固定する検査のため、この検査ではoffに固定 */
body { text-autospace: no-autospace; }

/* pdfg2dのテスト用CJKフォント(jp78/palt等を持つ)。foliojet4は
   settings.gradleで同じsibling checkoutを必須参照している */
@font-face {
	font-family: 'tf';
	src: url('../../../../../../zamasoftnet-public/pdfg2d/pdfg2d-font/src/test/resources/data/test.otf');
}
body { font-family: 'tf'; font-size: 10pt; }
</style>
</head>
<body>
<div>あ<span id="a">、、、、、、、、、、</span>あ</div>
<div>あ<span id="b" style="font-feature-settings: 'palt' 1">、、、、、、、、、、</span>あ</div>
<div>あ<span id="c" style="font-variant-east-asian: jis78">丈</span>あ</div>
<div>あ<span id="d">//////</span>あ</div>
<div>あ<span id="e" style="font-feature-settings: 'kern' off">//////</span>あ</div>
<div>あ<span id="f">fifi</span>あ</div>
<div>あ<span id="g" style="font-feature-settings: 'liga' 0, 'kern' 0">fifi</span>あ</div>
<div>あ<span id="h" style="font-variant-ligatures: none; font-feature-settings: 'kern' 0">fifi</span>あ</div>
<div>あ<span id="i" style="font-variant-ligatures: no-common-ligatures; font-feature-settings: 'kern' 0">fifi</span>あ</div>
<div>あ<span id="j" style="font-variant-ligatures: common-ligatures">fifi</span>あ</div>
</body>
</html>
